       *
       * 判据全部来自实测（一条龙 P2：20 分钟 / 35818 帧 / 360P）：
       *   场景突变度（HSV 直方图 Bhattacharyya）
       *       正常帧 p50=0.06、p99=0.22；真正换场地 > 0.5  → 阈值取 0.45
       *   黑场        平均亮度 < 20（这个视频有 16 处，是天然的分段标记）
       *   高动态      帧差 > 基线 × 2（实测占 26.6% 时长，全是打怪/特效）
       *
       * 注意一个反直觉的结论：帧差大 ≠ 快进。实测帧差最高的段落全是战斗，
       * 所以「画面动得快就暂停」会跟打怪撞车。这里只用直方图突变判跳步，
       * 而且突变之后要先看 1 秒——紧接着打成一团的（连续战斗）不算跳步。
       * ========================================================================== */

      var AN_W = 64, AN_H = 36, AN_NB = 64;
      var anCanvas = document.createElement("canvas");
      anCanvas.width = AN_W; anCanvas.height = AN_H;
      var anCtx = anCanvas.getContext("2d", { willReadFrequently: true });
      var anPrevGray = null, anPrevHist = null;
      var anMads = [], anPend = null, anBaseTick = 0;
      var pendPause = null;   // {info, until}：因为主播在讲话而推迟的暂停

      function syncAnBtn() {
        var b = document.getElementById("btnAn");
        if (!b) return;
        b.textContent = S.anOn ? "开" : "关";
        b.className = S.anOn ? "sw on" : "sw";
        b.style.color = S.anOn ? "#cfe6ff" : "";
        b.title = S.anOn
          ? "视频侧自动暂停：开（画面跳步时自动停车）"
          : "视频侧自动暂停：关（实验功能，会误停，默认关）";
      }

      function flashCut() {
        cutFlash.className = "on";
        setTimeout(function () { cutFlash.className = ""; }, 520);
      }

      function anReset() {
        anPrevGray = null; anPrevHist = null;
        anMads = []; anPend = null;
        S.anBase = 0; S.anN = 0;
      }

      function anSample() {
        if (!S.anOn || S.anMode === "off") return;
        if (!v.src || v.paused || v.ended || v.readyState < 2 || !v.videoWidth) return;

        var g, h, lum;
        try {
          anCtx.drawImage(v, 0, 0, AN_W, AN_H);
          var d = anCtx.getImageData(0, 0, AN_W, AN_H).data;
          g = new Uint8Array(AN_W * AN_H);
          h = new Float32Array(AN_NB);
          lum = 0;
          for (var i = 0, j = 0; i < d.length; i += 4, j++) {
            var gr = d[i] * 0.114 + d[i + 1] * 0.587 + d[i + 2] * 0.299;
            g[j] = gr;
            lum += gr;
            h[((d[i] >> 6) << 4) | ((d[i + 1] >> 6) << 2) | (d[i + 2] >> 6)]++;
          }
          lum /= (AN_W * AN_H);
          var n2 = AN_W * AN_H;
          for (var k = 0; k < AN_NB; k++) h[k] /= n2;
        } catch (e) {
          // 画布被跨源污染 → 抓不到像素。关掉分析，不影响播放。
          S.anOn = false;
          syncAnBtn();
          post("/log", { msg: "画面分析不可用（画布跨源受限），已自动关闭" });
          toast("画面分析不可用，已关闭（播放不受影响）");
          return;
        }

        var mad = 0, hd = 0;
        if (anPrevGray) {
          var sum = 0;
          for (var m = 0; m < g.length; m++) sum += Math.abs(g[m] - anPrevGray[m]);
          mad = sum / g.length;
          var bc = 0;
          for (var q = 0; q < AN_NB; q++) bc += Math.sqrt(anPrevHist[q] * h[q]);
          hd = Math.sqrt(Math.max(0, 1 - bc));
        }
        anPrevGray = g;
        anPrevHist = h;
        S.anN++;
        anMads.push(mad);
        if (anMads.length > 150) anMads.shift();

        // 基线：每 30 帧按最近 150 帧的中位数更新一次（中位数对战斗段不敏感）
        if (S.anN >= 16 && (S.anBase === 0 || ++anBaseTick >= 30)) {
          anBaseTick = 0;
          var s2 = anMads.slice().sort(function (a, b) { return a - b; });
          S.anBase = Math.max(0.3, s2[s2.length >> 1] || 1);
        }

        anJudge(hd, mad, lum);

        // 推迟的暂停：话讲完了就停；等太久（6 秒）也停
        if (pendPause && (Date.now() > pendPause.until || (voice.ok && voice.v === 0))) {
          var pp = pendPause;
          pendPause = null;
          doPauseNow(pp.info);
        }
      }

      function anJudge(hd, mad, lum) {
        var t = v.currentTime || 0;
        if (S.anCool && Date.now() < S.anCool) return;
        if (S.scrubCool && Date.now() < S.scrubCool) { anPend = null; return; }  // 刚拖过进度条，别误判
        if (lum < 20) { anPend = null; return; }     // 黑场：不算跳步，紧接着那帧才是

        var hot = S.anBase > 0 && mad > S.anBase * S.fightRatio;

        if (hd >= S.cutTh) {
          // 画面换场地了。先别急着停——要看接下来这 1 秒是不是连打。
          anPend = { t: t, hd: hd, hot: 0, n: 0 };
          return;
        }

        if (anPend) {
          anPend.n++;
          if (hot) anPend.hot++;
          if (anPend.n >= 5) {
            var info = anPend;
            anPend = null;
            // 突变后画面马上又剧烈变化（hot≥2）= 连着打，不该停
            if (info.hot <= 1) doAutoPause(info);
          }
        }
      }

      function doAutoPause(info) {
        if (v.paused) return;
        // 打怪点就在附近 → 让给打怪点。否则同一处会停两次：换场地先停一次，
        // 你按播放，1 秒后打怪点又把你按回去。
        if (S.marksOn && nearestMark(info.t, 10)) {
          post("/log", { msg: "场景突变紧邻打怪点，交给打怪点处理 t=" + Math.round(info.t) });
          return;
        }
        // 主播正在讲话 → 先别停，等他这一句说完再停（最多等 6 秒）
        // 直接"因为有声音就跳过"实测覆盖率只有一两成，等于功能失效；
        // 推迟到气口才是他真正想要的效果：不打断他讲，也不漏掉该停的地方。
        if (voiceSpeaking()) {
          pendPause = { info: info, until: Date.now() + 6000 };
          post("/log", { msg: "场景突变但在讲话，等气口再停 t=" + Math.round(info.t) });
          return;
        }
        doPauseNow(info);
      }

      function doPauseNow(info) {
        if (v.paused) return;
        // 往回退一点点，停在"新场景的第一眼"，而不是已经播了 1 秒
        try {
          var back = Math.max(0, info.t - 0.2);
          if (Math.abs(v.currentTime - back) < 5) v.currentTime = back;
        } catch (e) { }
        v.pause();
        S.anCool = Date.now() + 4000;
        flashCut();
        toast("视频跳步了 → 已暂停，自己走完再按播放");
        post("/log", { msg: "视频侧自动暂停：t=" + Math.round(info.t) + " 突变度=" + info.hd.toFixed(2) });
      }

      setInterval(anSample, 200);

      /* ================= 人声检测：主播在讲话就不要停 =================
         三个条件同时成立才算"在讲话"：
           1) 有能量 —— 不是静音
           2) 集中在中频 —— 300~3000Hz 占比过半（人声的基频和共振峰都在这儿）
           3) 有音节起伏 —— 3 秒内能量的波动系数大（一个字一个字蹦，BGM 是平的）
         加滞回：连续 0.6 秒才算开始讲、掉到 0.2 秒才算讲完，避免一顿一顿地抖。
         拿不到音频（CORS 污染 / 自动播放限制）就静默关掉，绝不影响播放和别功能。 */
      var voice = { ok: false, tried: false, ac: null, an: null, src: null,
                    buf: null, freq: null, env: [], hit: 0, v: 0, logAt: 0 };

      function voiceInit() {
        // 人声检测只为自动暂停服务；自动暂停关着就别接管音频图，省 CPU
        if (!S.anOn || !S.voiceGate) return;
        if (voice.tried) return;
        voice.tried = true;
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) { post("/log", { msg: "人声检测不可用：没有 AudioContext" }); return; }
          voice.ac = new AC();
          voice.src = voice.ac.createMediaElementSource(v);
          voice.an = voice.ac.createAnalyser();
          voice.an.fftSize = 1024;
          voice.an.smoothingTimeConstant = 0.4;
          voice.src.connect(voice.an);
          voice.src.connect(voice.ac.destination);   // 必须直连出口，否则视频会没声音
          voice.buf = new Float32Array(voice.an.fftSize);
          voice.freq = new Uint8Array(voice.an.frequencyBinCount);
          voice.ok = true;
          if (voice.ac.state === "suspended") {
            voice.ac.resume().catch(function () { voiceKill("音频被浏览器挂起"); });
          }
          post("/log", { msg: "人声检测就绪（" + voice.ac.state + "）" });
        } catch (e) {
          voice.ok = false;
          post("/log", { msg: "人声检测不可用：" + (e && e.message) });
        }
      }

      /** 关掉分析，但把音频直通还原，保证视频还有声音 */
      function voiceKill(why) {
        if (!voice.ok) return;
        voice.ok = false;
        try { voice.src.disconnect(); } catch (e) { }
        try { voice.an.disconnect(); } catch (e) { }
        try { voice.src.connect(voice.ac.destination); } catch (e) { }
        post("/log", { msg: "人声检测已关闭：" + why });
      }

      function voiceSample() {
        if (!voice.ok || !voice.ac || !voice.an || !voice.buf) return;
        if (voice.ac.state === "suspended") { voice.ac.resume().catch(function () { }); return; }
        var i, b = voice.buf, n = b.length, s = 0;
        try { voice.an.getFloatTimeDomainData(b); } catch (e) { return; }
        for (i = 0; i < n; i++) s += b[i] * b[i];
        var rms = Math.sqrt(s / n);

        voice.an.getByteFrequencyData(voice.freq);
        var bw = (voice.ac.sampleRate || 48000) / voice.an.fftSize;
        var lo = Math.floor(300 / bw), hi = Math.min(voice.freq.length - 1, Math.ceil(3000 / bw));
        var mid = 0, all = 0;
        for (i = 0; i < voice.freq.length; i++) {
          all += voice.freq[i];
          if (i >= lo && i <= hi) mid += voice.freq[i];
        }
        var midR = all > 0 ? mid / all : 0;

        voice.env.push(rms);
        if (voice.env.length > 15) voice.env.shift();
        var mean = 0;
        for (i = 0; i < voice.env.length; i++) mean += voice.env[i];
        mean /= voice.env.length;
        var vr = 0;
        for (i = 0; i < voice.env.length; i++) vr += (voice.env[i] - mean) * (voice.env[i] - mean);
        var cv = mean > 1e-4 ? Math.sqrt(vr / voice.env.length) / mean : 0;

        var talk = mean > 0.012 && midR > 0.50 && cv > 0.25;
        voice.hit = talk ? Math.min(voice.hit + 1, 20) : Math.max(voice.hit - 1, 0);
        if (voice.hit >= 3) voice.v = 1;
        else if (voice.hit <= 1) voice.v = 0;

        var now = Date.now();
        if (now - voice.logAt > 12000) {
          voice.logAt = now;
          post("/log", { msg: "人声：" + (voice.v ? "在讲" : "没讲") +
            " rms=" + rms.toFixed(3) + " 中频=" + midR.toFixed(2) + " 起伏=" + cv.toFixed(2) });
        }
      }
      function voiceSpeaking() { return voice.ok && !!voice.ac && voice.v === 1; }
      setInterval(voiceSample, 200);

      document.getElementById("btnAn").addEventListener("click", function () {
        S.anOn = !S.anOn;
        anReset();
        syncAnBtn();
        if (S.anOn) voiceInit(); else voiceKill("自动暂停已关");
        // 顺手存进设置：下次启动还是这个状态（⚙ 面板里的开关应该"记得住"）
        post("/pref", { autoPause: S.anOn });
        toast(S.anOn ? "视频侧自动暂停：开" : "视频侧自动暂停：关");
      });

      /* ================= 打怪点（比"猜画面"可靠：人来标，播到就停） ================= */
      function renderMarks() {
        if (!markTicks) return;
        var dur = S.duration || (isFinite(v.duration) ? v.duration : 0);
        markTicks.innerHTML = "";
        if (!S.marks.length || !(dur > 0)) {
          markTicks.className = "";
          return;
        }
        for (var i = 0; i < S.marks.length; i++) {
          var m = S.marks[i];
          if (!(m.t >= 0) || m.t > dur) continue;
          var el = document.createElement("i");
          if (m.w) el.className = "w";
          el.style.left = (100 * m.t / dur) + "%";
          markTicks.appendChild(el);
        }
        markTicks.className = S.marksOn ? "on" : "";
      }

      function markLabel(m) {
        if (m.w) return "挑战 / BOSS";
        return m.chest ? ("第 " + m.chest + " 个宝箱") : (m.label || "打怪点");
      }

      function fireMark(m) {
        if (v.paused) return;
        v.pause();
        S.markCool = Date.now() + 3000;
        S.markPrev = v.currentTime || m.t;
        // 把场景突变一起压住，避免"刚按播放又被跳步检测停了"
        S.anCool = Date.now() + 8000;
        anPend = null;
        flashCut();
        if (m.w) {
          // B 类：他刚把操作演示完，这里才轮到你
          showHint("这段看完了　轮到你上", 9000);
          toast("挑战 / BOSS · 该你了");
        } else {
          showHint("到了：" + markLabel(m) + "　打完再按播放", 9000);
          toast(markLabel(m) + " · 需要打怪");
        }
        post("/log", { msg: (m.w ? "看完点暂停：" : "打怪点暂停：") + markLabel(m) + " @" + Math.round(m.t) + "s" });
      }

      function markTick() {
        if (!S.marksOn || !S.marks.length) return;
        if (!v.src || v.ended || v.readyState < 1) { S.markPrev = -1; return; }
        var t = v.currentTime || 0, p = S.markPrev;
        S.markPrev = t;
        if (v.paused) return;
        // 刚起播、或者刚拖过进度条（时间跳得远）→ 不判定，避免误停
        if (p < 0 || Math.abs(t - p) > 2.5) return;
        if (S.markCool && Date.now() < S.markCool) return;
        for (var i = 0; i < S.marks.length; i++) {
          var m = S.marks[i];
          if (p < m.t && t >= m.t) { fireMark(m); return; }
        }
      }

      function nearestMark(t, win) {
        var best = null, bd = win;
        for (var i = 0; i < S.marks.length; i++) {
          var dd = Math.abs(S.marks[i].t - t);
          if (dd < bd) { bd = dd; best = S.marks[i]; }
        }
        return best;
      }

      /** 在当前时刻打点；附近 45 秒内已有点就"移动"它，Shift = 删除 */
      function addMark(del) {
        if (!v.src) { toast("先选一个视频"); return; }
        var t = Math.round((v.currentTime || 0) * 10) / 10;
        var m = nearestMark(t, 45);
        if (del) {
          if (!m) { toast("附近 45 秒内没有打怪点"); return; }
          S.marks.splice(S.marks.indexOf(m), 1);
          toast("已删除 " + fmt(m.t) + " 的打怪点");
        } else if (m) {
          m.t = t;
          S.marks.sort(function (a, b) { return a.t - b.t; });
          toast("打怪点已移到 " + fmt(t));
        } else {
          S.marks.push({ t: t, label: "打怪", chest: 0 });
          S.marks.sort(function (a, b) { return a.t - b.t; });
          toast("已打点 " + fmt(t) + "，播到这里会停");
        }
        renderMarks();
        post("/mark", { list: S.marks });
      }

      document.getElementById("btnMark").addEventListener("click", function (ev) {
        addMark(!!(ev && ev.shiftKey));
      });
      setInterval(markTick, 200);

      /* ================= 布局 / 外观 ================= */
      var DM_H = 92;      // 弹幕带高度

      /* ---- 分辨率自适应 ----------------------------------------------------
       * 浮窗坐标是「相对叠层窗口」的 CSS 像素。1600x900 下贴在右上角的浮窗，
       * 换到 2560x1440 还按原坐标摆，就会跑到画面中间；尺寸也还是 360 宽，
       * 占屏比例缩水一半。所以除了绝对像素，再额外记一份比例：
       *     rx = x / 视口宽   ry = y / 视口高   rw = 宽 / 视口宽   ar = 高 / 宽
       * 视口一变（切全屏、改分辨率、拖窗口边框）就按比例还原；
       * 视口没变但游戏分辨率变了（叠层盖住整屏的情况）就按「画面中心不动」缩放。
       */
      function syncRatio() {
        var W = Math.max(1, window.innerWidth), H = Math.max(1, window.innerHeight);
        // WebView2 刚起来时视口可能是 0 或极小，这时候算出来的比例是垃圾，
        // 一旦记下来就会把上次存好的位置冲掉，所以直接不动。
        if (W < 200 || H < 150) return;
        // 收起态的高度是"一条控制条"，不是真实比例，别拿它覆盖存盘的 ar
        if (S.collapsed) return;
        S.vw = W; S.vh = H;
        S.rx = S.x / W;
        S.ry = S.y / H;
        S.rw = S.w / W;
        S.ar = S.w > 1 ? (S.h / S.w) : (203 / 360);
      }

      /** 按比例算回绝对坐标，并夹在当前视口里（不会缩到看不见、也不会跑出屏幕） */
      function fitBox(rx, ry, rw, ar) {
        var W = Math.max(1, window.innerWidth), H = Math.max(1, window.innerHeight);
        if (!isFinite(ar) || ar < 0.2 || ar > 2) ar = 203 / 360;
        var w = clamp(rw * W, 160, W * 0.95);
        var h = w * ar;
        if (h > H * 0.95) { h = H * 0.95; w = h / ar; }     // 竖屏/窗口特别矮时按高反推
        if (w > W * 0.95) { w = W * 0.95; h = w * ar; }     // 反推之后再兜一次，别超宽
        S.w = Math.round(w);
        S.h = Math.round(h);
        S.x = Math.round(clamp(rx * W, -S.w + 80, Math.max(0, W - 80)));
        S.y = Math.round(clamp(ry * H, 0, Math.max(0, H - 40)));
      }

      /**
       * 上次是在别的分辨率/全屏状态下摆的：绝对像素没有意义，用比例还原。
       * 差 2px 以内就算了，避免每次启动都因为取整而微调。
       */
      function restoreSaved(d) {
        if (!S.fitRes || S.needDefault || !d || !d.ratio) return false;
        var bw = num(d.baseVw, 0), bh = num(d.baseVh, 0);
        if (!(bw > 100 && bh > 100)) return false;
        // 无论视口定没定，先把"上次的比例"装进来（视口一确定就能据此还原）
        S.rx = num(d.ratio.rx, S.rx);
        S.ry = num(d.ratio.ry, S.ry);
        S.rw = num(d.ratio.rw, S.rw);
        S.ar = num(d.ratio.ar, S.ar);
        S.vw = bw; S.vh = bh;      // 让 fitToViewport 知道"基准是上一次那套尺寸"
        // WebView2 刚起来、视口还没量出来时先不摆，等 resize 那一下再来
        if (!(window.innerWidth >= 200 && window.innerHeight >= 150)) return false;
        if (Math.abs(bw - window.innerWidth) <= 2 && Math.abs(bh - window.innerHeight) <= 2) return false;
        fitBox(S.rx, S.ry, S.rw, S.ar);
        post("/log", {
          msg: "分辨率自适应：上次 " + Math.round(bw) + "×" + Math.round(bh) +
            "，这次 " + window.innerWidth + "×" + window.innerHeight +
            "，浮窗按比例摆到 " + Math.round(S.x) + "," + Math.round(S.y) +
            " 尺寸 " + Math.round(S.w) + "×" + Math.round(S.h)
        });
        return true;
      }

      /** 视口尺寸变了：按上次记下的比例重排。返回是否真的重排了。 */
      function fitToViewport(msg) {
        if (!S.fitRes) { applyLayout(); return false; }
        var W = window.innerWidth, H = window.innerHeight;
        if (!(W > 100 && H > 100)) return false;
        if (!(S.vw > 100 && S.vh > 100)) { syncRatio(); return false; }   // 还没有基准
        if (Math.abs(W - S.vw) < 2 && Math.abs(H - S.vh) < 2) return false; // 视口没动
        fitBox(S.rx, S.ry, S.rw, S.ar);
        applyLayout();
        reportState(true);
        S.fitAt = Date.now();
        if (msg) toast(msg + " " + W + "×" + H);
        return true;
      }

      /** 视口没变、但游戏分辨率变了（叠层贴着整屏）：以视口中心为基准缩放 */
      function fitScale(k, msg) {
        if (!S.fitRes) return false;
        if (!(k > 0.2 && k < 5)) return false;
        var W = window.innerWidth, H = window.innerHeight;
        var cx = W / 2, cy = H / 2;
        var nw = clamp(S.w * k, 160, W * 0.95);
        var nh = clamp(S.h * k, 90, H * 0.95);
        S.w = Math.round(nw);
        S.h = Math.round(nh);
        S.x = Math.round(clamp(cx + (S.x - cx) * k, -S.w + 80, Math.max(0, W - 80)));
        S.y = Math.round(clamp(cy + (S.y - cy) * k, 0, Math.max(0, H - 40)));
        applyLayout();
        reportState(true);
        if (msg) toast(msg);
        return true;
      }

      var fitTimer = null;
      window.addEventListener("resize", function () {
        if (fitTimer) clearTimeout(fitTimer);
        // 切全屏时 resize 会连发好几下，等它稳定下来再算，免得按中间态的尺寸算错
        fitTimer = setTimeout(function () {
          fitTimer = null;
          fitToViewport("已按新分辨率自适应");
        }, 160);
      });

      /**
       * 主脚本每隔一秒上报一次游戏分辨率（getGameMetrics）。
       * 分辨变了但叠层视口没变，说明浮窗盖住的是整屏、游戏画面在屏内放大了，
       * 这时按「视口中心不动」缩放：居中窗口全屏时的位移正好等于中心缩放。
       */
      function onMetric(d) {
        var w = num(d.w, 0), h = num(d.h, 0), dpi = num(d.dpi, 1) || 1;
        if (!(w > 0 && h > 0)) return;
        var prev = S.metric;
        S.metric = [w, h, dpi];
        if (!prev) return;
        if (prev[0] === w && prev[1] === h && prev[2] === dpi) return;
        var oldCss = prev[0] / (prev[2] || 1), newCss = w / dpi;
        var k = oldCss > 0 ? (newCss / oldCss) : 1;
        // 刚因为视口变化重排过：同一次"切全屏"已经被处理了，别再按分辨率缩一遍，
        // 否则会缩两次（浮窗明显变小/变大）。
        if (Date.now() - S.fitAt < 2500) return;
        // 视口也跟着变了 → 交给 resize 那条路按比例还原，别叠两层缩放
        if (Math.abs(window.innerWidth - S.vw) > 2 || Math.abs(window.innerHeight - S.vh) > 2) {
          fitToViewport("已按新分辨率自适应");
        } else {
          fitScale(k, "游戏分辨率变了（" + w + "×" + h + "），浮窗已同步缩放");
        }
        post("/log", {
          msg: "游戏分辨率 " + prev[0] + "×" + prev[1] + " → " + w + "×" + h +
            "，视口 " + window.innerWidth + "×" + window.innerHeight +
            "，缩放 " + (Math.round(k * 1000) / 1000)
        });
      }

      /** 收起态的高度：正好装下一条控制条 */
      var BAR_H = 34;

      function applyLayout() {
        // 只有"这次启动压根没存过位置"才默认摆右上角。
        // 以前是用 x<0 判断，结果用户故意把浮窗拖到屏幕左边缘外时，会被弹回右上角。
        if (S.needDefault) {
          S.needDefault = false;
          S.x = Math.max(8, window.innerWidth - S.w - 16);
          S.y = 12;
        }
        S.w = Math.max(200, S.w);
        // 收起时高度只有一条控制条，不能按 120 的下限夹
        S.h = S.collapsed ? BAR_H : Math.max(120, S.h);
        S.x = clamp(S.x, -S.w + 80, Math.max(0, window.innerWidth - 80));
        var maxY = Math.max(0, window.innerHeight - (S.collapsed ? BAR_H + 2 : 40));
        S.y = clamp(S.y, 0, maxY);
        stage.style.left = Math.round(S.x) + "px";
        stage.style.top = Math.round(S.y) + "px";
        stage.style.width = Math.round(S.w) + "px";
        stage.style.height = Math.round(S.h) + "px";

        // 弹幕带紧贴视频下方（收起时本来就不显示，位置照算，展开就对了）
        dmLayer.style.left = Math.round(S.x) + "px";
        dmLayer.style.top = Math.round(S.y + S.h + 6) + "px";
        dmLayer.style.width = Math.round(S.w) + "px";
        dmLayer.style.height = DM_H + "px";

        syncRatio();          // 只要位置/尺寸落定，就把比例记下来（拖动、缩放后自动更新）
        layoutSide();
        reportGeom();
      }

      /**
       * 收起 / 展开：只显示"下边栏"（播放、快进那一排），画面和进度条都藏起来。
       * 关闭按钮改成收起之后，再也不会一不小心把整个浮窗关掉（那还得重跑脚本）。
       * 真正退出放在 ⚙ 面板最底下。
       */
      function setFolded(on) {
        on = !!on;
        if (S.collapsed === on) return;
        if (on) {
          S.hPrev = Math.max(BAR_H, S.h);
          S.h = BAR_H;
          // 控制条留在它原来的位置（画面区域向上消失），视觉上不会跳
          S.y = Math.max(0, S.y + S.hPrev - BAR_H);
          S.collapsed = true;
          stage.classList.add("folded");
          document.body.classList.add("folded");
          setGear(false);
          closeSide();
          applyOpacity();
        } else {
          S.collapsed = false;
          stage.classList.remove("folded");
          document.body.classList.remove("folded");
          S.h = Math.max(120, S.hPrev || 203);
          S.y = Math.max(0, S.y - (S.h - BAR_H));
          applyOpacity();
        }
        applyLayout();
        syncBar();
        reportState(true);
        post("/fold", { on: S.collapsed });
        toast(S.collapsed ? "已收起，只留下边栏（点 ⤢ 展开）" : "已展开画面");
      }

      /** 控制条显隐 + 收起键的图标，都跟着"可交互 / 收起态"走 */
      function syncBar() {
        bar.className = (S.interactive || S.collapsed) ? "show" : "";
        if (S.interactive && !S.collapsed) stage.classList.add("barOn");
        else stage.classList.remove("barOn");
        var b = document.getElementById("btnFold");
        if (b) {
          b.textContent = S.collapsed ? "⤢" : "▾";
          b.title = S.collapsed ? "展开画面" : "收起，只留下边栏（不退出脚本）";
        }
      }

      function applyOpacity() {
        if (S.hidden || S.collapsed) {
          stage.style.opacity = "1";
          stage.style.background = "transparent";
          stage.style.boxShadow = "";
          v.style.opacity = "0";
          cutFlash.style.opacity = "0";
        } else {
          stage.style.opacity = String(S.opacity);
          stage.style.background = "#000";
          stage.style.boxShadow = "";
          v.style.opacity = "1";
        }
        lblAlpha.textContent = Math.round(S.opacity * 100) + "%";
        var sl = document.getElementById("gOpacity");
        if (sl) sl.value = String(Math.round(S.opacity * 100));
      }

      function applySpeed() {
        try { v.playbackRate = S.speed; } catch (e) { }
        lblSpeed.textContent = S.speed.toFixed(2) + "×";
        syncSpeedPresets();
      }

      /* ================= 设置面板（⚙） =================
       * 自动暂停 / 打怪点 / 透明度 / 倍速 / 音量 / 登录，都塞进这个面板。
       * 为什么不摆在控制条上：默认窗口只有 360px 宽，原来一排 12 个按钮，
       * 变速和透明度被 CSS 的容器查询直接隐藏了 —— 等于没法用。
       */
      function syncSpeedPresets() {
        if (!gearEl) return;
        var btns = gearEl.querySelectorAll("[data-sp]");
        for (var i = 0; i < btns.length; i++) {
          var sp = num(btns[i].getAttribute("data-sp"), 0);
          btns[i].className = (Math.abs(sp - S.speed) < 0.001) ? "on" : "";
        }
      }

      function syncMarkOnBtn() {
        var b = document.getElementById("btnMarkOn");
        if (b) {
          b.textContent = S.marksOn ? "开" : "关";
          b.className = S.marksOn ? "sw on" : "sw";
        }
      }

      function syncAutoNextBtn() {
        var b = document.getElementById("btnAutoNext");
        if (b) {
          b.textContent = S.autoNext ? "开" : "关";
          b.className = S.autoNext ? "sw on" : "sw";
        }
        var s = document.getElementById("btnNextSec");
        if (s) {
          // 秒数按钮不做成"开/关"那种蓝底高亮，它是档位，不是开关
          s.textContent = S.autoNextSec + "s";
          s.className = "sw sec";
        }
      }

      function syncGear() {
        syncAnBtn();
        syncMarkOnBtn();
        syncAutoNextBtn();
        syncSpeedPresets();
        var lk = document.getElementById("gLoginKey");
        if (lk) lk.textContent = S.loginKey || "End";
        var sl = document.getElementById("gOpacity");
        if (sl) sl.value = String(Math.round(S.opacity * 100));
        if (lblSpeed) lblSpeed.textContent = S.speed.toFixed(2) + "×";
        if (lblAlpha) lblAlpha.textContent = Math.round(S.opacity * 100) + "%";
      }

      function setGear(on) {
        S.gearOn = !!on;
        // 齿轮和「键」面板互斥：开一个就把另一个收起来，免得两块板子叠着
        if (S.gearOn && typeof closeKeysPanel === "function") closeKeysPanel();
        if (gearEl) gearEl.className = S.gearOn ? "show" : "";
        if (S.gearOn) syncGear();
      }

      /* ================= 按键设置（v1.6.15） =================
       * 侧栏底部「键」按钮打开，盖住整个侧栏。
       *
       * 关键点：**页面收不到按键**。BGI 的浮窗虽然在最前面，但页面拿不到键盘
       * 焦点（document.hasFocus() 长期 false，实测过），所以"按一个键"这件事
       * 交给主脚本的全局钩子：这里只负责发 /keycap 请求，钩子把下一个键吃下来
       * 再通过 /keycap 回传。Esc 在钩子那边就被拦掉了。
       */
      var keysPanel = document.getElementById("keysPanel");
      var keysList = document.getElementById("keysList");
      var keysMsg = document.getElementById("keysMsg");

      /** 键名 → 人话。钩子上报的是小写名（f9 / menu / arrowleft…），别直接甩给用户 */
      function keyLabel(k) {
        if (!k) return "未设置";
        var map = {
          escape: "Esc", esc: "Esc",
          menu: "Alt", alt: "Alt", lmenu: "Alt", rmenu: "Alt",
          control: "Ctrl", controlkey: "Ctrl", lcontrol: "Ctrl", rcontrol: "Ctrl",
          shift: "Shift", lshift: "Shift", rshift: "Shift",
          "return": "Enter", enter: "Enter",
          space: "空格", insert: "Insert", "delete": "Del", backspace: "退格",
          tab: "Tab", pause: "Pause", home: "Home", end: "End",
          pageup: "PgUp", pagedown: "PgDn", capslock: "CapsLock",
          arrowleft: "←", arrowright: "→", arrowup: "↑", arrowdown: "↓",
          left: "←", right: "→", up: "↑", down: "↓"
        };
        if (map[k]) return map[k];
        return String(k).toUpperCase();
      }

      function renderKeys() {
        if (!keysList) return;
        var list = S.keys || [];
        keysList.innerHTML = "";
        if (!list.length) {
          keysList.appendChild(el("div", "kp-t", "还没拿到键位表（等脚本发 /init）…"));
          return;
        }
        for (var i = 0; i < list.length; i++) {
          (function (it) {
            var row = el("div", "kr");
            row.appendChild(el("span", "kl", it.label || it.id));

            var bt = el("button", "kb");
            var waiting = (S.keysCap === it.id);
            bt.className = "kb" + (it.key ? "" : " none") + (waiting ? " want" : "");
            bt.textContent = waiting ? "按键…" : keyLabel(it.key);
            bt.title = waiting ? "按一个键，Esc 取消"
              : (it.key ? "现在绑的是 " + keyLabel(it.key) + "，点一下换键"
                : "还没绑键，点一下绑一个");
            bt.addEventListener("click", function () { startKeyCap(it.id); });
            row.appendChild(bt);

            // 清空：只有绑了键才显示，免得一行三个按钮挤成一片
            if (it.key) {
              var kx = el("button", "kx", "×");
              kx.title = "清掉这个键（这个动作改用按钮点）";
              kx.addEventListener("click", function () { clearKey(it.id); });
              row.appendChild(kx);
            }
            keysList.appendChild(row);
          })(list[i]);
        }
      }

      function startKeyCap(id) {
        if (S.keysCap === id) { cancelKeyCap(); return; }
        S.keysCap = id;
        renderKeys();
        if (keysMsg) keysMsg.textContent = "按一个键…（Esc 取消）";
        post("/keycap", { id: id, on: true });
      }

      function cancelKeyCap() {
        if (!S.keysCap) return;
        S.keysCap = "";
        renderKeys();
        if (keysMsg) keysMsg.textContent = "";
        post("/keycap", { on: false });
      }

      function clearKey(id) {
        S.keysCap = "";
        for (var i = 0; i < S.keys.length; i++) {
          if (S.keys[i].id === id) S.keys[i].key = "";
        }
        renderKeys();
        if (keysMsg) keysMsg.textContent = "已清空";
        post("/hotkey", { id: id, key: "" });
      }

      /** 主脚本回传的当前键位表（改完键 / 初始化时都会来一次） */
      function onKeys(d) {
        if (d.keys && d.keys.length !== undefined) S.keys = d.keys.slice();
        if (d.tip) S.hotkeyTip = String(d.tip);
        if (d.holdKeyLabel !== undefined) S.holdKeyLabel = String(d.holdKeyLabel || "");
        renderKeys();
      }

      /** 钩子捕获到的那个键（或者 Esc 取消） */
      function onKeyCap(d) {
        var id = String(d.id || S.keysCap || "");
        S.keysCap = "";
        if (d.cancel) {
          renderKeys();
          if (keysMsg) keysMsg.textContent = d.timeout ? "超时，已取消" : "已取消";
          return;
        }
        var k = String(d.key || "");
        for (var i = 0; i < S.keys.length; i++) {
          if (S.keys[i].id === id) S.keys[i].key = k;
        }
        renderKeys();
        if (keysMsg) keysMsg.textContent = "「" + keyLabel(k) + "」已保存";
        post("/hotkey", { id: id, key: k });
      }

      function openKeysPanel() {
        if (!keysPanel) return;
        if (S.gearOn) setGear(false);
        keysPanel.className = "show";
        if (keysMsg) keysMsg.textContent = "";
        renderKeys();
        post("/keys", {});
      }

      function closeKeysPanel() {
        if (!keysPanel) return;
        keysPanel.className = "";
        cancelKeyCap();
      }

      function resetKeys() {
        if (keysMsg) keysMsg.textContent = "已恢复默认";
        post("/keys-reset", {});
      }

      function applyVolume() {
        v.volume = S.volume;
        v.muted = S.volume <= 0;
        btnMute.textContent = v.muted ? "🔇" : "🔊";
      }

      /* ---- 交互状态切换：只改界面，不碰播放 ----
       * 以前的版本进入缩放模式会自动暂停、退出自动续播。用户明确说不要：
       * "按 Ins 键视频不会继续，保持不变" —— 切走再回来、按热键接回浮窗，
       * 暂停就是暂停、在播就是在播，谁也别替用户做主。
       */
      function setInteractive(on) {
        on = !!on;
        S.interactive = on;
        // 设置里勾了「显示合集侧栏」= 每次浮窗变成可交互就把系列栏摆出来。
        // 它是"临时面板"，收起后不会被永久关掉 —— 下次按 Alt 还在原地等你。
        if (on && S.sideHome && !S.showSide) S.showSide = true;
        syncBar();
        for (var i = 0; i < rzList.length; i++) {
          rzList[i].className = (S.interactive && !S.collapsed) ? "rz show" : "rz";
        }
        layoutSide();
        if (S.interactive) armIdle();
        else disarmIdle();
        // 切回穿透时把设置面板一起收起来，别留个悬空的板子
        if (!S.interactive) setGear(false);
      }

      /* ================= 本地视频 ================= */
      function srcFor(file, urlOverride) {
        if (urlOverride && /^https?:\/\//i.test(urlOverride)) return urlOverride;
        if (!file) return "";
        return "videos/" + file.split("/").map(encodeURIComponent).join("/");
      }

      var pendingResume = 0;
      var pendingAutoplay = true;

      function loadVideo(file, urlOverride, resumeAt, autoplay) {
        var src = srcFor(file, urlOverride);
        if (!src) {
          showOverlay("还没有选视频。\n\n从左边节目单里挑一集，\n或者把 mp4 放进 assets/videos/ 后从「本地视频」里点。",
            function () { openSide(); }, "打开节目单");
          return;
        }
        hideOverlay();
        S.file = file;
        pendingResume = num(resumeAt, 0);
        pendingAutoplay = autoplay !== false;
        v.src = src;
        S.loadAt = Date.now();
        S.videoReady = false;
        try { v.load(); } catch (e) { }
      }

      function onMetaLoaded() {
        S.duration = isFinite(v.duration) ? v.duration : 0;
        renderMarks();
        if (pendingResume > 1 && pendingResume < S.duration - 3) {
          try { v.currentTime = pendingResume; } catch (e) { }
          toast("从上次进度 " + fmt(pendingResume) + " 继续");
        }
        pendingResume = 0;
        applySpeed();
        updateTime();
        if (pendingAutoplay) tryPlay();
      }

      function onVideoError() {
        var src = v.currentSrc || v.src || "(空)";
        if (!S.isBili || !S.bvid) {
          showOverlay("视频加载失败：" + src + "\n\n" +
            "1) 文件是否在 assets/videos/ 下\n2) 文件名是否一致\n3) 是否是 H.264 的 mp4",
            function () { try { v.load(); } catch (e) { } }, "重试");
          post("/error", { msg: "视频加载失败：" + src });
          return;
        }

        var t = Number(S.lastT) || 0;
        try { if (v.currentTime > 0.5) t = v.currentTime; } catch (e) { }

        // 第一层：可能是 B 站 CDN 这次没给 CORS 头 → crossorigin 直接让请求失败。
        // 先去掉 crossorigin 用普通方式重载（代价是画布会被污染、画面分析失效，
        // 但至少能播——播放永远比自动暂停重要）。
        if (!S.noCors) {
          S.noCors = true;
          S.anOn = false;
          syncAnBtn();
          try { v.removeAttribute("crossorigin"); } catch (e) { }
          post("/log", { msg: "带 CORS 加载失败 → 去掉 crossorigin 重试（画面分析自动关闭）" });
          showHint("这个视频取不到画面像素，只能用普通方式播放（自动暂停暂不可用）", 7000);
          pendingResume = t;
          pendingAutoplay = S.wantPlay !== false;
          try { v.load(); } catch (e) { }
          return;
        }

        // 第二层：直链大约 2 小时过期。报错时默默重取一条，接着原来的位置播。
        if (S.retried < 2) {
          S.retried++;
          showHint("视频地址失效，正在重新获取…", 6000);
          post("/log", { msg: "直链失效，重新取（第 " + S.retried + " 次，t=" + Math.round(t) + "）" });
          setTimeout(function () { requestPlayurl(t, S.wantPlay); }, 700);
          return;
        }

        showOverlay("视频加载失败：" + src + "\n\n" +
          "1) 检查 BetterGI 是否开了「JS HTTP 权限」\n2) 这个视频是否需要大会员",
          function () { requestPlayurl(t, S.wantPlay); }, "重新获取");
        post("/error", { msg: "视频加载失败：" + src });
      }

      function tryPlay() {
        if (!v.src) return;
        voiceInit();                       // 第一次真要出声时才接管音频，避免空跑
        if (voice.ac && voice.ac.state === "suspended") voice.ac.resume().catch(function () { });
        var p = v.play();
        if (p && typeof p.catch === "function") {
          p.catch(function () {
            v.muted = true;
            var q = v.play();
            if (q && typeof q.catch === "function") {
              q.then(function () { v.muted = S.volume <= 0; })
                .catch(function () { showHint("按播放热键或点一下画面开始播放", 6000); });
            }
          });
        }
      }

      /* ================= 播放控制 ================= */

      /**
       * 现在在线也是 <video>，播放状态可以真实读到，图标不会再卡在 ▶。
       */
      var lastPlayIcon = "";
      function syncPlayBtn() {
        if (!btnPlay) return;
        var playing = !!v.src && !v.paused && !v.ended;
        var icon = playing ? "❚❚" : "▶";
        if (icon === lastPlayIcon) return;
        lastPlayIcon = icon;
        btnPlay.textContent = icon;
        btnPlay.title = playing ? "暂停" : "播放";
      }
      setInterval(syncPlayBtn, 350);

      /* ---------- 卡住检测（v1.6.26）----------
         以前失败只有两种情况会被发现：接口明确回错误、video 报 error。
         但网络卡住时这两者都不发生，界面就一直停在「正在取视频地址…」转圈，
         用户不知道是慢还是死了。这里给两条超时兜底，并且都带「重试」。
         用页面的 setInterval —— 页面是正常浏览器环境，有定时器。 */
      setInterval(function () {
        var now = Date.now();

        // 1) 取播放地址卡住：12 秒没回音
        if (S.fetching && S.fetchAt && now - S.fetchAt > 12000) {
          S.fetching = false;
          S.fetchAt = 0;
          showOverlay("取视频地址超时了（12 秒没有响应）\n\n" +
            "可能是网络慢、B 站接口被拦，或者没开「JS HTTP 权限」。", function () {
            if (S.isBili && S.bvid) requestPlayurl(S.cur || 0, true);
          });
          post("/log", { msg: "playurl 超时（12s）" });
        }

        // 2) 地址拿到了但视频一直不起播：25 秒还没 loadedmetadata
        if (S.loadAt && !S.videoReady && now - S.loadAt > 25000) {
          S.loadAt = 0;
          showOverlay("视频加载超时了（25 秒还没起播）\n\n" +
            "这个 mp4 地址可能失效了，或者当前网速太慢。", function () {
            if (S.isBili && S.bvid) requestPlayurl(S.cur || 0, true);
            else { try { v.load(); } catch (e) { } }
          });
          post("/log", { msg: "视频起播超时（25s）" });
        }
      }, 1000);

      function togglePlay() {
        if (S.blank) { toast("先在系列栏里选一个视频"); return; }
        if (v.paused) tryPlay();
        else v.pause();
        syncPlayBtn();
      }

      /** 由脚本侧指定"播放/暂停"（战斗检测用），幂等 */
      function setPlaying(on) {
        on = !!on;
        if (on && v.paused) tryPlay();
        else if (!on && !v.paused) v.pause();
        syncPlayBtn();
      }

      function seekBy(sec) {
        if (!S.duration) return;
        var t2 = clamp((v.currentTime || 0) + sec, 0, S.duration);
        try { v.currentTime = t2; } catch (e) { }
        // 带上跳到的位置（跟页面自己处理方向键时的提示一致），按住连发时也看得清到了哪
        toast((sec > 0 ? "快进 → " : "← 快退 ") + fmt(t2));
        updateTime();
      }

      function setSpeed(sp) {
        S.speed = clamp(sp, 0.25, 4);
        applySpeed();
        reportState();
      }

      function setOpacity(o) {
        S.opacity = clamp(o, 0.05, 1);
        if (S.hidden && S.opacity > 0) S.hidden = false;
        applyOpacity();
        reportState();
      }

      function setHidden(on) {
        S.hidden = !!on;
        applyOpacity();
        toast(S.hidden ? "画面已隐藏（声音继续）" : "画面已显示");
      }

      function toggleMute() {
        S.volume = (S.volume > 0) ? 0 : 1;
        applyVolume();
        toast(S.volume > 0 ? "已取消静音" : "已静音");
        reportState();
      }

      /* ================= 指令分发 ================= */
      function applyCmd(a, value) {
        switch (a) {
          case "playPause": togglePlay(); break;
          case "setPlay": setPlaying(value === true); break;
          case "seek": seekBy(num(value, 5)); break;
          // 主脚本的方向键钩子发过来的音量增量（±0.1），和页面自己按 ↑↓ 走同一条路
          case "volume": keyVolume(num(value, 0.1)); break;
          case "speed": setSpeed(num(value, 1)); break;
          case "opacity": setOpacity(num(value, 1)); break;
          case "hide": setHidden(value === true); break;
          case "interactive": setInteractive(value === true); break;
          // 主脚本让我们把系列栏收回去（松开 Alt / 鼠标还给游戏 / 长时间没动）
          case "closeside": closeSideIfOpen(); break;
          case "toast": toast(String(value == null ? "" : value)); break;
          case "mark": addMark(false); break;
          case "load":
            if (value && value.src) applySource(value.src, num(value.resume, 0), value.autoplay !== false);
            break;
          case "flush": reportProgress(); reportState(); break;
          case "reload":
            // 重新取一条直链（登录后、或者地址过期时用）
            if (S.isBili && S.bvid) requestPlayurl(v.currentTime || 0, !v.paused);
            else if (v.src) { try { v.load(); } catch (e) { } }
            toast("已刷新视频");
            break;
          case "page":
            if (S.isBili) goPage(num(value, 1));
            break;
          default: break;
        }
      }

      /* ================= 上报 ================= */
      var lastStateAt = 0;
      function reportState(force) {
        var now = Date.now();
        if (!force && now - lastStateAt < 250) return;
        lastStateAt = now;
        post("/state", {
          x: Math.round(S.x),
          // 收起态报"展开后"的矩形（y 也换算回去，让控制条下沿对齐），
          // 主脚本拿它存盘；下次启动就是展开的样子，不会开成一条 34px 的横条。
          // 鼠标热区不走这个值，走 /geom 里的真实矩形。
          y: Math.round(S.collapsed ? Math.max(0, S.y - ((S.hPrev || BAR_H) - BAR_H)) : S.y),
          w: Math.round(S.w),
          h: Math.round(S.collapsed ? (S.hPrev || S.h) : S.h),
          // 比例一起报上去，主脚本存盘；下次在别的分辨率下启动也能摆回原来的相对位置
          rx: Math.round(S.rx * 10000) / 10000,
          ry: Math.round(S.ry * 10000) / 10000,
          rw: Math.round(S.rw * 10000) / 10000,
          ar: Math.round(S.ar * 10000) / 10000,
          vw: Math.round(S.vw || window.innerWidth),
          vh: Math.round(S.vh || window.innerHeight),
          opacity: S.opacity, speed: S.speed, volume: S.volume
        });
      }

      var lastGeomAt = 0;
      /** 告诉脚本侧：窗口在屏幕上的位置 + 视频矩形，用来做"鼠标悬停在视频上"的判断 */
      function reportGeom(force) {
        var now = Date.now();
        if (!force && now - lastGeomAt < 120) return;
        lastGeomAt = now;
        try {
          post("/geom", {
            sx: (typeof window.screenX === "number") ? window.screenX : (window.screenLeft || 0),
            sy: (typeof window.screenY === "number") ? window.screenY : (window.screenTop || 0),
            dpr: window.devicePixelRatio || 1,
            x: Math.round(S.x), y: Math.round(S.y),
            w: Math.round(S.w), h: Math.round(S.h),
            // 系列栏的矩形（没开就是 null）：主脚本用它算"鼠标还在不在浮窗上"
            side: (S.showSide && S.interactive && !S.collapsed && S.sideW) ? {
              x: S.sideX, y: S.sideY, w: S.sideW, h: S.sideH
            } : null
          });
        } catch (e) { }
      }

      function reportProgress() {
        post("/progress", {
          t: Math.round((v.currentTime || 0) * 10) / 10,
          d: Math.round((S.duration || 0) * 10) / 10,
          playing: !!v.src && !v.paused
        });
      }

      /* 记住"看到哪"（v1.6.22）。
         三个约束，都是为了别把没用的进度写进去：
           · 少于 5 秒不记 —— 点开就退不算看过；
           · 剩不到 15 秒不记 —— 已经看完了，下次别再问"接着看"；
           · 8 秒一次，暂停时强制写 —— 每次 timeupdate 都发会把通信刷爆。 */
      function reportLast(force) {
        var t = v.currentTime || 0;
        if (!(t > 5)) return;
        if (!S.bvid && !S.file) return;
        var dur = S.duration || 0;
        if (dur > 0 && t > dur - 15) return;
        var now = Date.now();
        if (!force && now - (S.lastSentAt || 0) < 8000) return;
        S.lastSentAt = now;
        post("/last", {
          bvid: S.bvid || "",
          page: S.page || 1,
          file: S.bvid ? "" : (S.file || ""),
          t: Math.round(t * 10) / 10,
          dur: Math.round(dur * 10) / 10,
          title: S.curTitle || S.nowTitle || ""
        });
      }

      /* ================= 提示 ================= */
      var toastTimer = null;
      function toast(text) {
        if (!text) return;
        toastEl.textContent = text;
        toastEl.className = "show";
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.className = ""; }, 1400);
      }

      var hintTimer = null;
      function showHint(text, ms) {
        if (!text) return;
        hintEl.textContent = text;
        hintEl.className = "show";
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = setTimeout(function () { hintEl.className = ""; }, ms || 8000);
      }
      function hideHint() {
        if (hintTimer) clearTimeout(hintTimer);
        hintEl.className = "";
      }

      /* 覆盖层。第二个参数是可选的重试回调——给了就多一个「重试」按钮。
         以前只有一段纯文字，卡住的时候用户只能干看着转圈，不知道该点哪。 */
      function showOverlay(text, retry, retryLabel) {
        S.blank = false;
        stage.classList.remove("blank");
        overlay.className = "show";
        overlay.innerHTML = "";
        S.retryFn = (typeof retry === "function") ? retry : null;
        // 用一个纵向容器装「文字 + 按钮」，否则 overlay 是 flex 行方向，按钮会跑到文字右边
        var box = document.createElement("div");
        box.className = "ov-box";
        var p = document.createElement("div");
        p.textContent = text;
        box.appendChild(p);
        if (S.retryFn) {
          var b = document.createElement("button");
          b.className = "bk";
          b.setAttribute("data-act", "retry");
          b.textContent = retryLabel || "重试";
          box.appendChild(b);
        }
        overlay.appendChild(box);
      }
      function hideOverlay() {
        S.blank = false;
        stage.classList.remove("blank");
        overlay.className = "";
        overlay.textContent = "";
        S.retryFn = null;
      }

      /* 启动空白页（v1.6.8）：一上来不放视频，整块纯黑 + 白字，
         只告诉你下一步点哪里。点它 = 打开系列栏（鼠标得先被 Insert 接住）。 */
      function escHtml(t) {
        return String(t == null ? "" : t)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      /* 「上次看到」那张卡（v1.6.22）。
         判据只看两件事：真看过一段（>5 秒）、没看到结尾。主脚本那边已经筛过一遍，
         这里再筛一次是因为页面自己也可能在播完一集后停在空白态。 */
      function resumeCard() {
        var w = S.last;
        if (!w) return "";
        var done = !!w.done;
        var t = num(w.t, 0);
        if (!done && !(t > 5)) return "";
        var label = w.title ? String(w.title) : (w.bvid || w.file || "上一个视频");
        if (num(w.page, 1) > 1) label += " · P" + num(w.page, 1);
        var ago = "";
        var at = num(w.at, 0);
        if (at > 0) {
          var m = Math.round((Date.now() - at) / 60000);
          ago = m < 1 ? "刚刚" : (m < 60 ? (m + " 分钟前")
            : (m < 1440 ? (Math.round(m / 60) + " 小时前") : (Math.round(m / 1440) + " 天前")));
        }
        var line = done
          ? ('看完了' + (num(w.dur, 0) > 0 ? ("（全长 " + fmt(num(w.dur, 0)) + "）") : ""))
          : (fmt(t) + (num(w.dur, 0) > 0 ? (" / " + fmt(num(w.dur, 0))) : "") + '　·　看到这里');
        return '<div class="rz" data-act="stop">' +
          '<div class="rt">' + (done ? "上次看完：" : "上次看到：") + escHtml(label) + '</div>' +
          '<div class="rs2">' + line + (ago ? ("　·　" + ago) : "") + '</div>' +
          '<div class="rb">' +
          (done ? '' : '<button data-act="resume">接着上次看</button>') +
          '<button data-act="from"' + (done ? '' : ' class="ghost"') + '>' +
          (done ? "再看一遍" : "从头开始") + '</button>' +
          '<button data-act="forget" class="ghost">不用了</button>' +
          '</div></div>';
      }

      function showBlank() {
        S.blank = true;
        stage.classList.add("blank");
        var card = resumeCard();
        overlay.className = "show blank" + (card ? " tight" : "");
        // 有"按住键临时接管鼠标"就把它写进第二行 —— 比让用户先按 Insert 直观得多
        var hold = S.holdKeyLabel || "";
        var hint = hold
          ? '按住 <i>' + hold + '</i>（或 <i>Insert</i>）→ 就能点'
          : '按 <i>Insert</i> → 就能点';
        // v1.6.25：把"黑屏"改成一张明确的引导页：给一个大按钮，别让人对着黑块猜。
        // 有续播卡时说明文字压成一句，否则 203px 装不下会把按钮挤出屏幕
        overlay.innerHTML = card
          ? (card +
            '<div class="bt">或者换一张地图</div>' +
            '<button class="bk" data-act="side">打开节目单</button>' +
            '<div class="bs">' + hint + '</div>')
          : ('<div class="bt">还没选视频</div>' +
            '<div class="bs">这里是攻略视频窗口，选一集就开始播</div>' +
            '<button class="bk" data-act="side">打开节目单</button>' +
            '<div class="bs">' + hint + '，然后点这个按钮</div>' +
            '<div class="bd">不想看就点右下角 ▾ 收起</div>');
      }

      /* 续播卡上的三个按钮。注意 overlay 本身点一下就打开系列栏，
         所以卡片里的点击必须 stopPropagation，否则点「接着看」会把侧栏一起拽出来。 */
      function onResumeClick(act) {
        var w = S.last;
        if (act === "forget") {
          S.last = null;
          post("/lastClear", {});
          showBlank();
          return true;
        }
        if (!w) return false;
        var t = (act === "resume") ? num(w.t, 0) : 0;
        S.last = null;
        post("/log", {
          msg: (act === "resume" ? "续播：" : "重新开始：") +
            (w.bvid || w.file || "?") + (num(w.page, 1) > 1 ? (" P" + num(w.page, 1)) : "") +
            (act === "resume" ? (" @" + Math.round(t) + "s") : "")
        });
        applySource({
          kind: w.bvid ? "bili" : (w.url ? "url" : "file"),
          bvid: w.bvid || "", page: num(w.page, 1) || 1,
          url: w.url || "", file: w.file || ""
        }, t, true);
        return true;
      }

      overlay.addEventListener("click", function (e) {
        var el = (e.target && e.target.closest) ? e.target.closest("[data-act]") : null;
        var act = el ? String(el.getAttribute("data-act") || "") : "";
        if (act) {
          e.stopPropagation();
          if (act === "stop") return;
          if (act === "side") { openSide(); return; }
          if (act === "retry") {
            var f = S.retryFn;
            S.retryFn = null;
            if (f) { try { f(); } catch (err) { post("/log", { msg: "重试出错：" + err }); } }
            return;
          }
          if (onResumeClick(act)) return;
        }
        if (!S.blank) return;
        openSide();
      });

      function updateTime() {
        S.cur = v.currentTime || 0;
        lblTime.textContent = fmt(S.cur) + " / " + fmt(S.duration);
        var pct = S.duration > 0 ? (S.cur / S.duration) * 100 : 0;
        progress.style.width = pct.toFixed(2) + "%";
      }

      /* ================= 拖动 / 四角缩放 ================= */
      var drag = null;

      function setDragging(on) {
        post("/dragstate", { d: !!on });
      }

      stage.addEventListener("pointerdown", function (e) {
        if (!S.interactive) return;
        armIdle();
        var t = e.target;
        if (t && t.closest && t.closest("#gear")) return;
        // 展开时按在控制条上是点按钮，不拖窗；收起时整条就是"拖动条"，
        // 只有按钮本身除外（否则按钮按不动）。
        if (t && t.closest && t.closest("#bar") && (!S.collapsed || t.closest("button"))) return;
        if (t && t.className && String(t.className).indexOf("rz") >= 0) return;
        drag = {
          mode: "move", sx: e.clientX, sy: e.clientY, ox: S.x, oy: S.y,
          t0: Date.now(), moved: false,
        };
        stage.classList.add("dragging");
        setDragging(true);
        try { stage.setPointerCapture(e.pointerId); } catch (err) { }
        e.preventDefault();
      });

      // 四个角都能拉，像画中画一样
      for (var ri = 0; ri < rzList.length; ri++) {
        (function (handle) {
          handle.addEventListener("pointerdown", function (e) {
            if (!S.interactive) return;
            armIdle();
            drag = {
              mode: "size",
              dir: handle.getAttribute("data-d") || "br",
              sx: e.clientX, sy: e.clientY,
              ox: S.x, oy: S.y, ow: S.w, oh: S.h
            };
            stage.classList.add("resizing");
            setDragging(true);
            try { handle.setPointerCapture(e.pointerId); } catch (err) { }
            e.preventDefault();
            e.stopPropagation();

      window.addEventListener("pointermove", function (e) {
        if (!S.interactive) return;
        armIdle();
        if (!drag) return;
        var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
        if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;

        if (drag.mode === "move") {
          S.x = drag.ox + dx;
          S.y = drag.oy + dy;
        } else {
          var d = drag.dir;
          var nx = drag.ox, ny = drag.oy, nw = drag.ow, nh = drag.oh;
          if (d.indexOf("l") >= 0) { nx = drag.ox + dx; nw = drag.ow - dx; }
          if (d.indexOf("r") >= 0) { nw = drag.ow + dx; }
          if (d.indexOf("t") >= 0) { ny = drag.oy + dy; nh = drag.oh - dy; }
          if (d.indexOf("b") >= 0) { nh = drag.oh + dy; }
          nw = Math.max(200, nw);
          nh = Math.max(112, nh);

      window.addEventListener("pointerup", function () {
        if (!drag) return;
        // v1.6.8：删掉"单击画面 = 把鼠标还给游戏"。这个手势太容易被误触
        // （手滑一下、想点暂停没点中、拖完松手，鼠标就掉回游戏，浮窗当场失控）。
        // 现在单击只做一件事：把设置面板收起来。要还鼠标给游戏请按缩放热键
        // （默认 Insert），或者什么都不碰等空闲自动穿透。
        var tap = (drag.mode === "move" && !drag.moved && (Date.now() - drag.t0) < 500);

        stage.classList.remove("dragging");
        stage.classList.remove("resizing");

      stage.addEventListener("wheel", function (e) {
        if (!S.interactive) return;

        if (e.target && e.target.closest && e.target.closest("#gear")) return;

      var idleTimer = null;
      function armIdle() {
        if (!S.interactive) return;
        if (idleTimer) clearTimeout(idleTimer);

      /* ================= 进度条拖动 =================
       * 注意一个前提：这层浮窗默认是「鼠标穿透」的，鼠标事件根本到不了页面，
       * 所以拖不动不是代码问题。主脚本的 hoverMode 打开后，鼠标停在视频上会
       * 临时关闭穿透（移开一会儿自动恢复），那时才拖得动。
       */
      (function initScrub() {
        var bar = document.getElementById("progress");
        var tip = document.getElementById("scrubTip");
        var dragging = false, resumePlay = false;

        function pctAt(e) {
          var r = bar.getBoundingClientRect();
          if (!r.width) return 0;
          var x = (e.clientX - r.left) / r.width;
          return x < 0 ? 0 : (x > 1 ? 1 : x);
        }

        function show(p) {
          var t = p * (S.duration || 0);
          tip.textContent = fmt(t);
          tip.style.left = (p * 100).toFixed(2) + "%";
          tip.classList.add("on");
          progress.style.width = (p * 100).toFixed(2) + "%";   // 蓝条跟着手走
        }

        function commit(p) {
          tip.classList.remove("on");
          if (!S.duration) return;
          var t = p * S.duration;
          try { v.currentTime = t; } catch (e) { }
          S.cur = t;
          // 拖完时间会突然跳很远，跳步检测和打怪点判定都得重新校准，
          // 否则一松手就被当成"换场地"，视频立刻自己停住。
          S.markPrev = t;
          S.scrubCool = Date.now() + 1500;
          S.anPend = null;
          // 拖的时候如果本来在播，就接着播
          if (resumePlay) { try { v.play(); } catch (e) { } }
        }

        bar.addEventListener("pointerdown", function (e) {
          if (!S.duration) return;
          dragging = true;
          resumePlay = !v.paused;
          // 告诉主脚本"我正在拖进度条"：它会暂时不做穿透切换，
          // 否则手一停住，鼠标 1 秒没动就被判定为移开，穿透一关拖动就断了。
          post("/scrub", { on: true });
          try { bar.setPointerCapture(e.pointerId); } catch (err) { }
          show(pctAt(e));
          e.preventDefault();
          e.stopPropagation();
        });

        bar.addEventListener("pointermove", function (e) {
          if (!dragging) return;
          show(pctAt(e));
          e.preventDefault();
        });

        bar.addEventListener("pointerup", function (e) {
          if (!dragging) return;
          dragging = false;
          commit(pctAt(e));
          post("/scrub", { on: false });
          e.preventDefault();
        });

        bar.addEventListener("pointercancel", function () {
          if (!dragging) return;
          dragging = false;
          tip.classList.remove("on");
          post("/scrub", { on: false });
        });
      })();

      /* ================= 按钮 ================= */
      document.getElementById("btnPlay").addEventListener("click", togglePlay);
      document.getElementById("btnBack").addEventListener("click", function () { seekBy(-5); });
      document.getElementById("btnFwd").addEventListener("click", function () { seekBy(5); });

      document.getElementById("btnGear").addEventListener("click", function () { setGear(!S.gearOn); });

      /* ---------- 点别处就把 ⚙ 面板收起来（v1.6.15） ----------

       * 能先把面板关掉，又不会影响被点那个按钮自己的 click。
       * 点 ⚙ 自己和面板内部不算"别处"（否则滑块拖一半就没了）。

      document.addEventListener("pointerdown", function (e) {

      document.addEventListener("pointerdown", function (e) {

      document.getElementById("btnNext").addEventListener("click", function () {

      });
      // 收起 / 展开：只留下边栏，不退出脚本

      document.getElementById("btnSide").addEventListener("click", function () {

      document.getElementById("btnLogin").addEventListener("click", function () { post("/login", {}); });
      document.getElementById("btnLogin2").addEventListener("click", function () { post("/login", {}); });
      document.getElementById("btnFav").addEventListener("click", toggleFav);
      document.getElementById("btnDm").addEventListener("click", toggleDm);
      document.getElementById("btnStats").addEventListener("click", showStats);
      document.getElementById("btnSnap").addEventListener("click", function () { post("/snapshot", {}); });
      document.getElementById("btnRefresh").addEventListener("click", function () {
        // 本地视频这一层：↻ = 重新扫 assets/videos（放完文件不用重开脚本）
        if (S.catLocal) {
          S.catMsg = "重新扫描 assets/videos…";
          post("/api/local", {});
          renderCatList();
          return;
        }
        // 分类视图下 ↻ = 重建索引（会重新去 B 站拉一遍，十几秒）
        if (S.view === "catalog") {

      document.getElementById("btnCat").addEventListener("click", function () {

      /* ================= 看完自动续播（v1.6.16） =================
       * 用户：一集看完，应该 5 秒后自己跳到下一个。
       * 「下一个」按这个顺序找：
       *   1. 同一个 B 站视频还有下一个分P（31 个 P 的一条龙就是这种）→ 直接切 P
       *   2. 分类视图里，同类下面的下一个视频（至冬7.0 → 至冬7.1）
       *   3. 系列视图里，当前这页合集分集的下一条
       * 都没有就不倒计时，只提示「已经是最后一个」，绝不自作主张重播。
       *
       * 定时器用页面的 setInterval（页面是正常浏览器环境，有定时器；
       * 主脚本和钩子回调里都没有 setTimeout，所以这事只能放在页面做）。

      var nxEl = document.getElementById("nx");
      var nxLeft = document.getElementById("nxLeft");
      var nxFill = document.getElementById("nxFill");

      function nextTarget() {

        if (S.isBili && S.pages && S.pages.length > 1) {
          for (var i = 0; i < S.pages.length; i++) {
            if (S.pages[i].i !== S.page) continue;
            if (i + 1 < S.pages.length) {
              var p = S.pages[i + 1];
              // v1.6.18：卡片上不再显示「下一个是什么」，只留倒计时 + 立即/取消，
              // 所以这里只带一个 run()。
              return { run: function () { goPage(p.i); } };
            }
            break;
          }
        }
        // 2) 分类视图：同类里的下一个视频
        if (S.view === "catalog" && S.catItems && S.catItems.length) {
          var list = [], k;
          for (k = 0; k < S.catItems.length; k++) {
            if ((S.catItems[k].kind || "其他") === S.catKind) list.push(S.catItems[k]);
          }
          for (k = 0; k < list.length; k++) {
            if (list[k].bvid !== S.bvid) continue;
            if (k + 1 < list.length) {
              var nx = list[k + 1];
              return { run: function () { enterCatVideo(nx); } };
            }
            break;
          }
        }
        // 3) 系列视图：合集分集的下一条（只在本页 30 条里找）
        if (S.view === "series" && S.epLast && S.epLast.items) {
          var its = S.epLast.items;
          for (var m = 0; m < its.length; m++) {
            if (its[m].bvid !== S.bvid) continue;
            if (m + 1 < its.length) {
              var it = its[m + 1];
              return { run: function () { playBvid(it.bvid); } };
            }
            break;
          }
        }
        return null;
      }

      function cancelAutoNext() {
        if (S.nxTimer) { clearInterval(S.nxTimer); S.nxTimer = null; }

        if (!S.nxTarget) return;

          playNextTarget(t);
          return;
        }
        if (nxLeft) nxLeft.textContent = String(Math.ceil(left / 1000));
        if (nxFill) {
          var pct = S.nxTotal > 0 ? (left / S.nxTotal) * 100 : 0;
          nxFill.style.width = Math.max(0, Math.min(100, pct)) + "%";
        }
      }

        if (!t) return;

          post("/log", { msg: "自动续播失败：" + e });

        cancelAutoNext();

        var t = nextTarget();
        if (!t) { toast("本节播放完毕（已经是最后一个）"); return; }
        var sec = S.autoNextSec > 0 ? S.autoNextSec : 10;
        S.nxTarget = t;
        S.nxTotal = sec * 1000;
        S.nxAt = Date.now() + S.nxTotal;
        if (nxLeft) nxLeft.textContent = String(sec);
        if (nxFill) nxFill.style.width = "100%";
        if (nxEl) nxEl.className = "show";
        S.nxTimer = setInterval(tickAutoNext, 100);
        toast("本节播放完毕，" + sec + " 秒后播下一个");

      /* ================= 视频事件 ================= */

      /* ================= 启动 ================= */

      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      /* ---------- 屏蔽浮窗内置浏览器的快捷键 ----------
       * BGI 的浮窗是 WebView2（Edge 内核），自带一整套浏览器快捷键；而脚本那边的
       * 键盘钩子只能"听见"按键、吞不掉，所以同一个键会被两边同时处理。这里把页面
       * 能拦住的都拦掉：F3 查找框、Ctrl+F/P/U/S/O、Ctrl+Shift+I/J/C。
       *
       * 注意：F12（开发者工具）和 F5（刷新）是浏览器级命令，页面里 preventDefault
       * 是拦不住的——那两个只能靠主脚本换键（main.js 的 SAFE_ALIAS）。
       * 右键菜单也已经拦了，否则菜单里的"检查"同样会打开 DevTools。
       */
      document.addEventListener("keydown", function (e) {
        var k = String(e.key || "").toLowerCase();
        var mod = e.ctrlKey || e.metaKey;
        if (/^f\d{1,2}$/.test(k)) {
          var n = Number(k.slice(1));
          // F1 帮助 / F3 查找 / F5 刷新 / F6 地址栏 / F7 光标浏览
          // F10 菜单栏 / F11 全屏 / F12 开发者工具
          if (n === 1 || n === 3 || n === 5 || n === 6 || n === 7 || n === 10 || n === 11 || n === 12) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
        }
        if (mod && (k === "r" || k === "p" || k === "f" || k === "u" || k === "s" || k === "o")) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        if (mod && e.shiftKey && (k === "i" || k === "j" || k === "c")) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      /* ================= 方向键：←/→ 快退快进，↑/↓ 音量 =================
       * v1.6.14 起：主脚本用全局键盘钩子接管了方向键，**不用先按 F9**，游戏有焦点时
       * 也管用（原神本来就没绑方向键）。所以正常运行时这里被 S.keyGlobal 关掉，避免
       * 浮窗刚好有焦点时一次按键跳两下；只有钩子没起来（keysGlobal=false）才退回这里。
       * 按住不放会连发：每次跳 5 秒，但至少隔 140ms。
       */
      function isTypingTarget(t) {
        if (!t) return false;
        var tag = String(t.tagName || "").toLowerCase();
        return tag === "input" || tag === "textarea" || tag === "select" || t.isContentEditable === true;
      }

      var seekKeyAt = 0, seekToastAt = 0, volKeyAt = 0, volToastAt = 0;

      /* step 是"秒"，正数快进、负数快退；别在这里再乘一次，否则一次按就跳 25 秒 */
      function keySeek(step) {
        var now = Date.now();
        if (now - seekKeyAt < 140) return;
        seekKeyAt = now;
        if (!S.duration) return;
        var t2 = clamp((v.currentTime || 0) + step, 0, S.duration);
        try { v.currentTime = t2; } catch (e) { }
        updateTime();
        if (now - seekToastAt > 400) {
          seekToastAt = now;
          toast((step > 0 ? "快进 → " : "← 快退 ") + fmt(t2));
        }
      }

      function keyVolume(d) {
        var now = Date.now();
        if (now - volKeyAt < 80) return;
        volKeyAt = now;
        S.volume = clamp(Math.round((S.volume + d) * 100) / 100, 0, 1);
        applyVolume();
        reportState();
        if (now - volToastAt > 300) {
          volToastAt = now;
          toast(S.volume <= 0 ? "静音" : "音量 " + Math.round(S.volume * 100) + "%");
        }
      }

      document.addEventListener("keydown", function (e) {
        // 续播倒计时期间按 Esc 就停在当前集（v1.6.16）
        if (S.nxTarget && (e.key === "Escape" || e.key === "Esc")) {
          cancelAutoNext();
          toast("好，停在这一集");
          return;
        }
        if (S.keysCap) return;                            // 正在「按一个键」改键，别抢
        // Esc 先把系列栏收回去（v1.6.28）：面板开着时最顺手的"关掉"
        if (S.showSide && (e.key === "Escape" || e.key === "Esc")) {
          e.preventDefault();
          closeSideIfOpen();
          return;
        }
        if (S.keyGlobal) return;                          // 主脚本的全局钩子已经在管，别重复处理
        if (e.ctrlKey || e.altKey || e.metaKey) return;   // 带修饰键的留给别处
        if (isTypingTarget(e.target)) return;             // 侧栏输入框里打字时不抢
        var k = e.key;
        if (k !== "ArrowLeft" && k !== "ArrowRight" && k !== "ArrowUp" && k !== "ArrowDown") return;
        e.preventDefault();
        e.stopPropagation();
        if (k === "ArrowLeft") keySeek(-5);
        else if (k === "ArrowRight") keySeek(5);
        else if (k === "ArrowUp") keyVolume(0.1);
        else keyVolume(-0.1);
      }, true);

      function boot() {
        applyLayout();
        applyOpacity();
        applySpeed();
        applyVolume();
        updateTime();
        if (!wireChannel()) {
          var tries = 0;
          var t = setInterval(function () {
            tries++;
            if (wireChannel() || tries > 15) {
              clearInterval(t);
              if (!channelWired) {
                showOverlay("没能和 BetterGI 建立通信。\n请确认是通过 BetterGI 脚本运行的。");
              }
            }
          }, 100);
        }
        post("/ready", {});
        // 初值：万一 focus/blur 事件来得晚，先让主脚本知道现在到底有没有焦点
        try { post("/focus", { on: !!(document.hasFocus && document.hasFocus()) }); } catch (e) { }
        setTimeout(function () { reportGeom(true); }, 300);
        setTimeout(function () { reportGeom(true); }, 1200);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }

      // 自动化测试用的出口（正常使用不会碰它，挂上去不影响任何行为）
      window.__vmDebug = {
        S: S, v: v,
        doAutoPause: doAutoPause, doPauseNow: doPauseNow,
        fireMark: fireMark, nearestMark: nearestMark, anReset: anReset,
        voiceSpeaking: voiceSpeaking, voice: voice,
        get pendPause() { return pendPause; },
        set pendPause(x) { pendPause = x; },
      };
    })();
  </script>
</body>

</html>
