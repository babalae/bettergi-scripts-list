<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoMask Player</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      cursor: default;
    }

    /* ---------- 视频舞台 ---------- */
    #stage {
      position: fixed;
      left: 16px;
      top: 470px;
      width: 360px;
      height: 203px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 28px rgba(0, 0, 0, .55);
      transition: opacity .12s linear;
      container-type: inline-size;
    }

    #stage.dragging,
    #stage.resizing {
      box-shadow: 0 10px 36px rgba(0, 0, 0, .7), 0 0 0 2px #6cf;
    }

    #v {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }

    /* 检测到「视频跳步」时在画面上闪一下红框，比 toast 更直观 */
    #cutFlash {
      position: absolute;
      inset: 0;
      border: 3px solid #ff4d6d;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .14s linear;
    }

    #cutFlash.on {
      opacity: 1;
    }

    /* ---------- 加载/错误提示 ---------- */
    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      color: #dfe7f2;
      font-size: 13px;
      line-height: 1.7;
      background: rgba(12, 14, 18, .92);
      white-space: pre-wrap;
      word-break: break-all;
    }

    #overlay.show {
      display: flex;
    }

    /* 错误/提示层的纵向容器：文字在上、重试按钮在下 */
    #overlay .ov-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 100%;
    }

    /* ---------- 启动空白页（v1.6.8） ----------
       不放视频，只告诉你下一步点哪。
       v1.6.25：原来整块纯黑（#07090d），别人第一次用会以为脚本坏了。
       改成半透明深色 + 轻模糊，游戏画面能透出来，"这是个引导页"而不是"黑屏卡死"。
       点这块 = 打开系列栏（前提是鼠标已经被 Insert 接住）。 */
    #overlay.blank {
      background: rgba(7, 9, 13, .68);
      backdrop-filter: blur(3px);
      color: #fff;
      font-size: 13px;
      line-height: 2.05;
      letter-spacing: .3px;
      cursor: pointer;
      word-break: normal;
      flex-direction: column;
      /* 顶端对齐 + 可滚：带续播卡时内容比 203px 高，居中会把上下都裁掉，
         而"接着上次看"这个按钮恰恰在最上面。 */
      justify-content: flex-start;
      overflow-y: auto;
      gap: 2px;
      padding: 12px;
    }

    /* 有续播卡时：字缩小一档、左对齐（卡片本身是块，居中会显得歪） */
    #overlay.blank.tight {
      line-height: 1.72;
      align-items: stretch;
      text-align: left;
    }

    #overlay.blank.tight .bt {
      font-size: 14px;
      margin-bottom: 2px;
    }

    #overlay.blank.tight .bd {
      margin-top: 4px;
    }

    #overlay.blank .bt {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #overlay.blank .bs {
      color: #cfd9e6;
    }

    #overlay.blank .bs i {
      font-style: normal;
      color: #ffd166;
    }

    #overlay.blank .bs b {
      font-weight: 700;
      color: #ffd166;
    }

    #overlay.blank .bd {
      margin-top: 10px;
      color: #9aa6b6;
      font-size: 11px;
      letter-spacing: 0;
    }

    /* v1.6.25：空白页/错误页上的主按钮。以前只有一行小字"点黑屏"，没人知道能点。 */
    #overlay .bk {
      display: inline-block;
      align-self: flex-start;
      margin: 6px 0 8px;
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      background: #ffd166;
      color: #1a1a1a;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: .5px;
      cursor: pointer;
    }

    #overlay.blank .bk:hover {
      background: #ffdd8a;
    }

    #overlay.blank.tight .bk {
      margin: 2px 0 4px;
      padding: 6px 14px;
      font-size: 12px;
    }

    /* ---------- 续播卡（v1.6.22） ----------
       看完一集退出去，下次进来先问一句"要不要接着上次"。只在真看过一段
       （>5 秒且没看到结尾）时才出现，刚点开就退的不会来烦人。 */
    #overlay.blank .rz {
      margin: 0 0 10px;
      padding: 9px 11px;
      border-radius: 8px;
      background: rgba(86, 211, 255, .10);
      border: 1px solid rgba(86, 211, 255, .38);
      cursor: default;
      word-break: break-all;
    }

    #overlay.blank .rz .rt {
      color: #eaf6ff;
      font-weight: 700;
      line-height: 1.55;
    }

    #overlay.blank .rz .rs2 {
      margin-top: 2px;
      color: #8fa6bd;
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0;
    }

    #overlay.blank .rz .rb {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    #overlay.blank .rz button {
      font: inherit;
      font-size: 12px;
      line-height: 1;
      padding: 6px 13px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid rgba(86, 211, 255, .55);
      background: rgba(86, 211, 255, .20);
      color: #dff3ff;
    }

    #overlay.blank .rz button:hover {
      background: rgba(86, 211, 255, .34);
    }

    #overlay.blank .rz button.ghost {
      border-color: rgba(255, 255, 255, .18);
      background: transparent;
      color: #9fb0c4;
    }

    #overlay.blank .rz button.ghost:hover {
      background: rgba(255, 255, 255, .07);
    }

    /* 空白态没有时长也没有打怪点，进度条先藏起来，别在纯黑上留一根线 */
    #stage.blank #progress,
    #stage.blank #markTicks,
    #stage.blank #scrubTip {
      display: none;
    }

    /* ---------- 控制条 ---------- */
    #bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      padding-right: 26px;
      background: linear-gradient(to top, rgba(0, 0, 0, .82), rgba(0, 0, 0, .45));
      backdrop-filter: blur(6px);
      font-size: 12px;
      color: #eaeef5;
      overflow: hidden;
    }

    #bar.show {
      display: flex;
    }

    #bar .grow {
      flex: 1;
    }

    #bar .lbl {
      opacity: .8;
      padding: 0 2px;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- 设置面板（⚙） ----------
       小窗口（默认 360px 宽）里控制条塞不下变速/透明度/自动暂停这些按钮，
       统一收进这个面板：点 ⚙ 打开，点画面任意空白处收起。 */
    #gear {
      position: absolute;
      right: 6px;
      bottom: 36px;
      width: 238px;
      max-height: calc(100% - 42px);
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 2px;
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(16, 18, 24, .95);
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .6);
      color: #dfe7f2;
      font-size: 12px;
      z-index: 12;
    }

    #gear.show {
      display: flex;
    }

    #gear .gr {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #gear .gn {
      width: 48px;
      flex: none;
      opacity: .72;
      font-size: 11px;
    }

    #gear .gv {
      min-width: 44px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-weight: normal;
    }

    #gear input[type=range] {
      flex: 1;
      min-width: 0;
      height: 16px;
      margin: 0;
      accent-color: #6cf;
    }

    #gear button {
      height: 20px;
      min-width: 24px;
      padding: 0 6px;
      font-size: 11px;
    }

    #gear .gp {
      gap: 3px;
    }

    #gear .gp button {
      flex: 1;
      min-width: 0;
      padding: 0 2px;
    }

    #gear .gp button.on,
    #gear .sw.on {
      background: #2d6fa8;
    }

    #gear .sw {
      min-width: 40px;
    }

    /* 续播秒数：数字宽度会变（3s / 10s / 30s），用等宽数字别让按钮抖 */
    #gear .sw.sec {
      min-width: 44px;
      font-variant-numeric: tabular-nums;
    }

    #gear .gtip {
      opacity: .55;
      font-size: 10px;
      line-height: 1.45;
      padding-top: 1px;
    }

    /* 真正退出浮窗的按钮放在面板最底下 —— ✕ 已经改成"收起"了，
       要彻底关掉脚本得来这里（或者按设置里配的热键）。 */
    #gear .gq {
      padding-top: 3px;
      border-top: 1px solid rgba(255, 255, 255, .1);
    }

    #gear .gq button {
      width: 100%;
      background: rgba(192, 57, 43, .28);
    }

    button {
      appearance: none;
      border: 0;
      background: rgba(255, 255, 255, .1);
      color: #eaeef5;
      border-radius: 5px;
      height: 24px;
      min-width: 26px;
      padding: 0 7px;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
    }

    button:hover {
      background: rgba(255, 255, 255, .22);
    }

    button:active {
      background: rgba(255, 255, 255, .32);
    }

    button.danger:hover {
      background: #c0392b;
    }

    /* 进度条贴在画面最下方（v1.6.4 从顶部挪到底部） */
    #progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: rgba(255, 255, 255, .12);
      cursor: pointer;
      touch-action: none;
      z-index: 8;
      transition: bottom .12s linear;
    }

    /* 控制条出来的时候把进度条顶上去，别被那排按钮压住 */
    #stage.barOn #progress {
      bottom: 36px;
    }

    /* 条本身只有 3px 高，小窗口里根本点不中。
       用伪元素把可点击/可拖动的范围往上撑到 16px，视觉上还是细的一根。 */
    #progress::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -15px;
      height: 18px;
    }

    #progress:hover {
      height: 5px;
    }

    #progress>i {
      display: block;
      height: 100%;
      width: 0;
      background: #6cf;
      pointer-events: none;
    }

    /* 拖进度条时跟着手走的时间气泡（在条上方弹出） */
    #scrubTip {
      position: absolute;
      bottom: 12px;
      transform: translateX(-50%);
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(0, 0, 0, .8);
      color: #fff;
      font-size: 10px;
      font-weight: normal;
      line-height: 1.5;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .1s;
      z-index: 9;
    }

    #scrubTip.on {
      opacity: 1;
    }

    /* ---------- 打怪点刻度（视频进度条上的红点） ---------- */
    #markTicks {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 9px;
      pointer-events: none;
      z-index: 9;
      display: none;
      transition: bottom .12s linear;
    }

    #stage.barOn #markTicks {
      bottom: 36px;
    }

    #markTicks.on {
      display: block;
    }

    #markTicks i {
      position: absolute;
      bottom: 0;
      width: 2px;
      height: 9px;
      margin-left: -1px;
      background: #ff5f5f;
      box-shadow: 0 0 4px rgba(255, 95, 95, .85);
    }

    /* 挑战/打boss：整段看完再停，用青点区分 */
    #markTicks i.w {
      height: 13px;
      width: 3px;
      background: #56d3ff;
      box-shadow: 0 0 5px rgba(86, 211, 255, .9);
    }

    /* ---------- 四角缩放手柄（画中画式） ---------- */
    .rz {
      position: absolute;
      width: 18px;
      height: 18px;
      display: none;
      z-index: 7;
    }

    .rz.show {
      display: block;
    }

    #rz-tl {
      left: 0;
      top: 0;
      cursor: nwse-resize;
    }

    #rz-tr {
      right: 0;
      top: 0;
      cursor: nesw-resize;
    }

    #rz-bl {
      left: 0;
      bottom: 0;
      cursor: nesw-resize;
    }

    #rz-br {
      right: 0;
      bottom: 0;
      cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 0 45%, #6cf 45% 55%, transparent 55% 70%, #6cf 70% 80%, transparent 80%);
      opacity: .85;
    }

    /* ---------- 侧栏：合集 / 分集 ---------- */
    #side {
      position: fixed;
      width: 300px;
      display: none;
      flex-direction: column;
      background: rgba(16, 18, 24, .93);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      overflow: hidden;
      color: #dfe7f2;
      font-size: 12px;
      box-shadow: 0 6px 28px rgba(0, 0, 0, .55);
      z-index: 10;
    }

    #side.show {
      display: flex;
    }

    #sideHead {
      display: flex;
      gap: 4px;
      padding: 6px;
      background: rgba(255, 255, 255, .04);
    }

    #collSel {
      flex: 1;
      min-width: 0;
      height: 24px;
      background: rgba(255, 255, 255, .08);
      color: #eaeef5;
      border: 0;
      border-radius: 5px;
      font-size: 12px;
      font-family: inherit;
      padding: 0 4px;
    }

    #collSel option,
    #collSel optgroup {
      background: #1b1e26;
      color: #eaeef5;
    }

    #epList {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px;
    }

    /* ---------- 分类视图（地区 → 一条龙/宝箱/神瞳/主线） ---------- */
    #crumb {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 6px 8px;
      background: rgba(108, 204, 255, .12);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      flex: 0 0 auto;
    }

    #crumb.show {
      display: flex;
    }

    #crumb:hover {
      background: rgba(108, 204, 255, .22);
    }

    #crumb .ar {
      color: #6cf;
      font-size: 13px;
    }

    #crumb .who {
      color: #6cf;
      font-weight: 600;
    }

    #crumb .hint {
      margin-left: auto;
      font-size: 10px;
      opacity: .5;
    }

    /* ---------- 当前视频标题条（v1.6.10） ----------
       以前这一集的完整标题混在分P列表里，一条能占两三行，
       31 个分P 只看得到三四条。现在它固定在面包屑下面，列表里每行只留一行。 */
    #nowBar {
      display: none;
      align-items: baseline;
      gap: 6px;
      padding: 5px 8px;
      background: rgba(255, 255, 255, .07);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      font-size: 11px;
      flex: 0 0 auto;
      cursor: pointer;
      user-select: none;
    }

    #nowBar.show {
      display: flex;
    }

    #nowBar .lb {
      flex: 0 0 auto;
      color: #6cf;
      font-weight: 600;
    }

    #nowBar .ti {
      flex: 1;
      min-width: 0;
      color: #dbe7f5;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* 点一下展开全文（标题实在太长时用） */
    #nowBar.open .ti {
      white-space: normal;
      word-break: break-all;
      line-height: 1.5;
      max-height: 78px;
      overflow-y: auto;
    }

    #catList {
      display: none;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px;
    }

    #catList.show {
      display: block;
    }

    #catList::-webkit-scrollbar {
      width: 8px;
    }

    #catList::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .18);
      border-radius: 4px;
    }

    .cat {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 7px 9px;
      margin-bottom: 5px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .07);
      cursor: pointer;
    }

    .cat:hover {
      background: rgba(108, 204, 255, .16);
      border-color: rgba(108, 204, 255, .35);
    }

    .cat .row1 {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .cat .nm {
      font-size: 13px;
      font-weight: 600;
      color: #eaf3ff;
    }

    .cat .pa {
      font-size: 10px;
      opacity: .5;
    }

    .cat .ct {
      margin-left: auto;
      font-size: 11px;
      opacity: .6;
    }

    .cat .kd {
      font-size: 10px;
      opacity: .55;
      line-height: 1.5;
    }

    /* 二级视图（一条龙卡片）复用 .cat，这里只把预览标题压一行 */
    #epList .cat {
      margin-bottom: 5px;
    }

    #epList .cat .kd {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* 同一个 BV 下的多个分P（合集里常见：31 个 P 共用一个 BV）。
       v1.6.10：标题改成单行后这里能放更多条，高度从 130 提到 170（约 8 条）。 */
    #sidePages {
      display: none;
      flex: 0 1 auto;
      max-height: 170px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      background: rgba(108, 204, 255, .05);
    }

    #sidePages.show {
      display: block;
    }

    /* 第四层（看分P）：这一层侧栏里只有分P，让它撑满整块，
       一屏能看到十几个 P（前三层不会出现这一栏） */
    #side[data-lv="3"] #sidePages {
      max-height: none;
      flex: 1 1 auto;
    }

    #sidePages .ph {
      font-size: 11px;
      opacity: .55;
      padding: 2px 5px;
    }

    #sidePages::-webkit-scrollbar {
      width: 8px;
    }

    #sidePages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .18);
      border-radius: 4px;
    }

    /* ---------- 收起态：只留一条控制条 ----------
       点 ✕ 不再把整个浮窗关掉（那样还得重新跑脚本），只把画面收起来，
       留下边栏那几个键（播放/快进/倍速/收起）。 */
    #stage.folded {
      background: transparent;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .5);
    }

    #stage.folded #v,
    #stage.folded #progress,
    #stage.folded #markTicks,
    #stage.folded #cutFlash,
    #stage.folded #overlay,
    #stage.folded .rz {
      display: none !important;
    }

    #stage.folded #bar {
      padding: 5px 8px;
    }

    /* 收起后横向空间紧张：侧栏、打点按钮先让位，把时间显示出来 */
    #stage.folded #btnSide,
    #stage.folded #btnMark {
      display: none;
    }

    #stage.folded #lblTime {
      display: inline;
      font-size: 11px;
    }

    /* 弹幕带、字幕、热键提示都是配合画面的，收起时一起藏掉 */
    body.folded #dm,
    body.folded #sub,
    body.folded #hint {
      display: none !important;
    }

    #epList::-webkit-scrollbar {
      width: 8px;
    }

    #epList::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .18);
      border-radius: 4px;
    }

    .ep {
      padding: 5px 7px;
      border-radius: 5px;
      cursor: pointer;
      line-height: 1.35;
      display: flex;
      gap: 6px;
      align-items: baseline;
    }

    .ep:hover {
      background: rgba(108, 204, 255, .16);
    }

    .ep.cur {
      background: rgba(108, 204, 255, .26);
      box-shadow: inset 2px 0 0 #6cf;
    }

    .ep .no {
      opacity: .55;
      font-variant-numeric: tabular-nums;
      flex: 0 0 auto;
    }

    /* 每行标题只占一行（超出省略，鼠标停上去看全文）。
       v1.6.10：以前最多两行，「至冬7.0 一条龙」这种长标题一条就吃掉三行，
       分P 列表一屏只看得到三四条。 */
    .ep .ti {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .ep .du {
      opacity: .5;
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums;
    }

    #sideFoot {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 5px 6px;
      background: rgba(255, 255, 255, .04);
    }

    #sideMsg {
      flex: 1;
      opacity: .6;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* ---------- 按键设置面板（v1.6.15，盖在侧栏上面） ---------- */
    #keysPanel {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background: rgba(13, 15, 21, .98);
      z-index: 6;
    }

    #keysPanel.show {
      display: flex;
    }

    #keysPanel .kp-h {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      font-size: 12px;
      background: rgba(108, 204, 255, .13);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    #keysPanel .kp-h b {
      flex: 1;
      font-weight: 600;
    }

    #keysPanel .kp-h button {
      width: 22px;
      height: 20px;
      padding: 0;
      font-size: 13px;
      line-height: 1;
      border: 0;
      border-radius: 4px;
      background: rgba(255, 255, 255, .1);
      color: #eaeef5;
      cursor: pointer;
    }

    #keysPanel .kp-t {
      padding: 4px 8px 2px;
      font-size: 11px;
      line-height: 1.5;
      opacity: .62;
    }

    #keysList {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 2px 6px 6px;
    }

    #keysList::-webkit-scrollbar {
      width: 6px;
    }

    #keysList::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .16);
      border-radius: 3px;
    }

    .kr {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .kr:nth-child(odd) {
      background: rgba(255, 255, 255, .03);
    }

    .kr .kl {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .kr .kb {
      min-width: 64px;
      height: 20px;
      padding: 0 6px;
      font-size: 11px;
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 4px;
      background: rgba(255, 255, 255, .1);
      color: #eaeef5;
      cursor: pointer;
    }

    .kr .kb:hover {
      background: rgba(108, 204, 255, .22);
      border-color: rgba(108, 204, 255, .5);
    }

    .kr .kb.none {
      opacity: .45;
    }

    .kr .kb.want {
      background: #2d6ea8;
      border-color: #6cf;
      animation: kblink 1s linear infinite;
    }

    @keyframes kblink {
      50% {
        opacity: .5;
      }
    }

    .kr .kx {
      width: 18px;
      height: 18px;
      padding: 0;
      font-size: 12px;
      line-height: 1;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: rgba(255, 255, 255, .45);
      cursor: pointer;
    }

    .kr .kx:hover {
      background: rgba(255, 90, 90, .25);
      color: #fff;
    }

    #keysPanel .kp-f {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 6px;
      background: rgba(255, 255, 255, .04);
      font-size: 11px;
    }

    #keysPanel .kp-f button {
      height: 22px;
      padding: 0 7px;
      font-size: 11px;
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 4px;
      background: rgba(255, 255, 255, .08);
      color: #dfe7f2;
      cursor: pointer;
    }

    #keysMsg {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      opacity: .65;
    }

    /* ---------- 弹幕投影（屏幕最上方一条横带） ---------- */
    #dm {
      position: fixed;
      overflow: hidden;
      pointer-events: none;
      z-index: 25;
      display: none;
      border-radius: 6px;
    }

    #dm.show {
      display: block;
    }

    .dmi {
      position: absolute;
      left: 100%;
      white-space: nowrap;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.2;
      text-shadow: 0 0 3px #000, 0 0 6px #000, 1px 1px 2px #000;
      animation-name: dmscroll;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      will-change: left;
    }

    @keyframes dmscroll {
      from {
        left: 100%;
      }

      to {
        left: -100%;
      }
    }

    /* ---------- 字幕 / 方向提示 ---------- */
    #sub {
      position: fixed;
      left: 50%;
      bottom: 64px;
      transform: translateX(-50%);
      max-width: 86vw;
      padding: 6px 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, .68);
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s;
      z-index: 26;
      text-shadow: 0 1px 2px #000;
    }

    #sub.show {
      opacity: 1;
    }

    #sub .arw {
      color: #6cf;
      margin-right: 8px;
      font-size: 20px;
    }

    /* ---------- 飘字 / 提示 ---------- */
    #toast {
      position: fixed;
      left: 50%;
      top: 18px;
      transform: translateX(-50%) translateY(-8px);
      padding: 7px 16px;
      border-radius: 18px;
      background: rgba(0, 0, 0, .72);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, transform .18s;
      white-space: nowrap;
      z-index: 30;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      max-width: 92vw;
      padding: 6px 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, .62);
      color: #d8e2ee;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      z-index: 30;
    }

    #hint.show {
      opacity: 1;
    }

    /* ---------- 看完自动续播（v1.6.16，v1.6.18 精简） ----------
       一集放完，倒计时 N 秒（默认 10）自动切下一个。
       卡片只有一行：剩余秒数 + 立即 / 取消，底下一条进度条；
       不显示下一个是什么（v1.6.18 起去掉「接下来播放 · 下一个分P」和标题行）。 */
    #nx {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 6px;
      display: none;
      padding: 5px 8px 6px;
      border-radius: 7px;
      background: rgba(8, 10, 14, .88);
      border: 1px solid rgba(108, 204, 255, .30);
      color: #e8eef7;
      font-size: 12px;
      line-height: 1.35;
      z-index: 14;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .5);
    }

    #nx.show {
      display: block;
    }

    #nx .nx-b {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #nx .nx-c {
      flex: 1;
      min-width: 0;
      color: #b9cee3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #nx .nx-c b {
      color: #6cf;
    }

    #nx button {
      flex: 0 0 auto;
      height: 20px;
      padding: 0 7px;
      font-size: 11px;
      color: #cfe0f2;
      background: rgba(255, 255, 255, .09);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 4px;
      cursor: pointer;
    }

    #nx button:hover {
      background: rgba(108, 204, 255, .22);
      color: #fff;
    }

    #nx .nx-bar {
      display: block;
      height: 2px;
      margin-top: 6px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .14);
      overflow: hidden;
    }

    #nx .nx-bar b {
      display: block;
      height: 100%;
      width: 100%;
      background: #6cf;
    }

    /* 收起态（只剩一条控制条）时不显示 */
    #stage.folded #nx {
      display: none;
    }

    /* 视频拖窄时按宽度自动丢次要按钮，保证关闭键永远点得到 */
    @container (max-width: 640px) {
      #lblTime {
        display: none;
      }
    }

    @container (max-width: 430px) {

      #btnPrev,
      #btnNext {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="stage">
    <video id="v" playsinline preload="metadata" crossorigin="anonymous"></video>
    <div id="cutFlash"></div>
    <div id="progress"><i></i><b id="scrubTip"></b></div>
    <div id="markTicks"></div>
    <div id="overlay"></div>

    <!-- 看完自动续播（v1.6.16）：一集播完在这里倒计时，5 秒后自动切下一个 -->
    <div id="nx">
      <div class="nx-b">
        <span class="nx-c"><b id="nxLeft">10</b> 秒后自动切换</span>
        <button id="btnNxGo" title="不用等，马上播下一个">立即</button>
        <button id="btnNxNo" title="不切了，停在这一集">取消</button>
      </div>
      <i class="nx-bar"><b id="nxFill"></b></i>
    </div>

    <div id="bar">
      <button id="btnSide" title="显示/隐藏合集侧栏">☰</button>
      <button id="btnPrev" title="上一个">|◀</button>
      <button id="btnBack" title="后退">◀◀</button>
      <button id="btnPlay" title="播放/暂停">▶</button>
      <button id="btnFwd" title="前进">▶▶</button>
      <button id="btnNext" title="下一个">▶|</button>
      <span class="lbl" id="lblTime">00:00 / 00:00</span>
      <span class="grow"></span>
      <button id="btnMark" title="打怪点：在当前时刻打点（靠近已有的点就移动它，Shift+点击删除）">＋怪</button>
      <button id="btnGear" title="设置：自动暂停 / 打怪点 / 透明度 / 倍速">⚙</button>
      <button id="btnFold" title="收起，只留下边栏（不退出脚本）">▾</button>
    </div>

    <!-- 设置面板：小窗口下（360px）控制条放不下这么多按钮，统一收进这里 -->
    <div id="gear">
      <div class="gr">
        <span class="gn">自动暂停</span>
        <button id="btnAn" class="sw" title="视频侧自动暂停（实验，默认关）：画面跳步时自动停，有误停可能">关</button>
      </div>
      <div class="gr">
        <span class="gn">打怪点</span>
        <button id="btnMarkOn" class="sw" title="播到打怪点自动暂停，让你自己打完再点继续（打怪点由 UP 主全集 4950 分钟字幕统计出来的，不是见宝箱就停）">开</button>
      </div>
      <div class="gr">
        <span class="gn">看完续播</span>
        <button id="btnAutoNext" class="sw" title="一集播完 10 秒后自动切下一个：优先下一个分P，没有就接同类里的下一个视频">开</button>
        <button id="btnNextSec" class="sw sec" title="倒计时秒数：点一下换一档（3 / 5 / 10 / 15 / 20 / 30），立刻生效并存进设置">10s</button>
      </div>
      <div class="gr">
        <span class="gn">透明度</span>
        <input id="gOpacity" type="range" min="20" max="100" step="5" title="画面透明度" />
        <b class="gv" id="lblAlpha">100%</b>
      </div>
      <div class="gr">
        <span class="gn">倍速</span>
        <button id="gSpeedDown" title="减速 0.25">－</button>
        <b class="gv" id="lblSpeed">1.00×</b>
        <button id="gSpeedUp" title="加速 0.25">＋</button>
      </div>
      <div class="gr gp">
        <span class="gn"></span>
        <button data-sp="0.5">0.5</button>
        <button data-sp="0.75">0.75</button>
        <button data-sp="1">1</button>
        <button data-sp="1.25">1.25</button>
        <button data-sp="1.5">1.5</button>
        <button data-sp="2">2</button>
      </div>
      <div class="gr">
        <span class="gn">其它</span>
        <button id="btnMute" title="静音/取消静音">🔊</button>
        <button id="btnHide" title="隐藏画面（声音继续）">隐藏</button>
        <button id="btnLogin2" title="登录 B 站，提高清晰度">登录</button>
      </div>
      <div class="gtip">登录窗是全屏的，会盖住画面；登录完按 <b id="gLoginKey">End</b> 关掉</div>
      <div class="gq">
        <button id="btnQuit" class="danger" title="真的关掉浮窗（结束脚本）">关闭浮窗（退出）</button>
      </div>
    </div>
    <div id="rz-tl" class="rz" data-d="tl"></div>
    <div id="rz-tr" class="rz" data-d="tr"></div>
    <div id="rz-bl" class="rz" data-d="bl"></div>
    <div id="rz-br" class="rz" data-d="br"></div>
  </div>

  <div id="dm"></div>

  <div id="side">
    <div id="sideHead">
      <select id="collSel" title="合集 / 系列 / 收藏"></select>
      <button id="btnCat" title="按地区分类浏览（枫丹 / 须弥 / 璃月…）">分</button>
      <button id="btnRefresh" title="重新拉取列表">↻</button>
      <button id="btnFav" title="收藏/取消收藏当前视频">☆</button>
      <button id="btnDm" title="弹幕投影开关">弹</button>
    </div>
    <div id="crumb" title="点这里返回上一层">
      <span class="ar">←</span>
      <span>返回</span>
      <span class="who" id="crumbWho"></span>
      <span class="hint" id="crumbHint">回到分类</span>
    </div>
    <!-- v1.6.10：正在看的这一集单独一行（从分P列表里挪出来）。
         列表里每行标题只留一行，31 个分P 就能多看到好几条；点这条展开/收起全文。 -->
    <div id="nowBar" title="正在播放的这一集，点一下展开/收起完整标题">
      <span class="lb">当前</span>
      <span class="ti" id="nowTi"></span>
    </div>
    <div id="catList"></div>
    <div id="sidePages"></div>
    <div id="epList"></div>
    <div id="sideFoot">
      <button id="btnPagePrev" title="上一页">‹</button>
      <span id="sideMsg">未加载</span>
      <button id="btnPageNext" title="下一页">›</button>
      <button id="btnStats" title="肝度报告">肝</button>
      <button id="btnKeys" title="按键设置：播放暂停 / Insert / Alt 这些都能自己改">键</button>
      <button id="btnSnap" title="保存当前游戏画面（校准战斗检测用）">截</button>
      <button id="btnLogin" title="在独立窗口登录 B 站">登录</button>
    </div>

    <!-- 按键设置（v1.6.15）：点一行 → 按一个键 → 立刻生效并写回设置。
         是一个盖在侧栏上的整页，不挤占分P 列表的位置。 -->
    <div id="keysPanel">
      <div class="kp-h">
        <b>按键设置</b>
        <button id="btnKeysClose" title="关掉">×</button>
      </div>
      <div class="kp-t">点右边的键位，然后按你想用的键（Esc 取消）。同一个键只干一件事，被顶掉的动作会自动清空。</div>
      <div id="keysList"></div>
      <div class="kp-f">
        <button id="btnKeysReset" title="恢复成 ~ / Insert / Alt / End">恢复默认</button>
        <span id="keysMsg"></span>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="hint"></div>
  <div id="sub"></div>

  <script>
    (function () {
      "use strict";

      /* ================= 状态 ================= */
      var S = {
        x: 16, y: 470, w: 360, h: 203,
        // 分辨率自适应：位置/尺寸除了绝对像素，再记一份相对视口的比例，
        // 换分辨率或切全屏后按比例还原（详见下面的 fitBox/fitToViewport）
        fitRes: true,
        rx: 0.01, ry: 0.52, rw: 0.225, ar: 203 / 360,
        vw: 0, vh: 0,
        metric: null,          // 上一次收到的游戏分辨率 [w,h,dpi]
        fitAt: 0,              // 上次因视口变化重排的时间（防止和 /metric 叠着缩两次）
        needDefault: false,    // 首次启动没存过位置 → 摆右上角
        opacity: 1, speed: 1, volume: 1,
        interactive: false, hidden: false,
        file: "", urlOverride: "",
        // 在线：B 站直链自播（不再是跨域 iframe）
        isBili: false, bvid: "", page: 1, cid: "",
        pages: [], qn: 64, fetching: false, retried: 0,
        pendingSeek: 0, seekTimer: null,
        // 视频侧自动暂停（画面跳步检测）—— 默认关，判据还不太成熟
        anOn: false, anMode: "cut", cutTh: 0.45, fightRatio: 2.0,
        anBase: 0, anN: 0, anCool: 0, anWarm: 0,
        scrubCool: 0,
        // 打怪点：视频里「这一段要自己打怪」的时间点，播到就停
        marks: [], marksOn: false, markPrev: -1, markCool: 0,
        // 人声：主播在讲解时不因为画面换场地而暂停
        voiceGate: true,
        // 侧栏
        showSide: true, sidePinned: false, upMid: "",
        // 系列栏的屏幕矩形（v1.6.28）：随 /geom 报给主脚本，用来判断"鼠标还在不在浮窗上"
        sideX: 0, sideY: 0, sideW: 0, sideH: 0, sideShown: false,
        // 设置里「显示合集侧栏」：每次变可交互时是否自动把系列栏摆出来
        sideHome: false,
        collections: null, curKind: "", curId: "", epPage: 1, epTotal: 0,
        // 分类视图（四级钻取：地区 → 类型 → 版本视频 → 分P）
        view: "catalog",          // catalog=按合集分类（默认） / series=按 B 站系列
        catGroups: [], catSel: "", catKind: "", catItems: [], catTotal: 0,
        catBvid: "",              // 第四级：点进某一集才填，这时才显示「当前 P2」和分P 列表
        catBusy: false, catMsg: "",
        // 本地视频（主脚本扫 assets/videos 得到），用来在侧栏里直接点播自己加的视频
        locals: [], catLocal: false,
        epLast: null,            // 上一次的合集分集数据（切回系列视图时直接重画）
        // 当前视频标题条（v1.6.10）：面包屑下面单独一行，点一下展开全文
        nowTitle: "", nowOpen: false,
        // 上次看到哪（主脚本从设置里带过来）＋ 上报节流
        last: null, lastSentAt: 0,
        // 弹幕 / 收藏 / 统计
        dmOn: false, dmList: [], dmCursor: 0, dmLastT: -1, dmNodes: 0,
        curTitle: "",
        fav: [], stats: {},
        subs: [], subOn: true, subIdx: -1,
        autoPicked: false,       // 仅保留字段（v1.6.8 起不再自动选片）
        // 卡住检测（v1.6.26）：取地址 / 视频起播 各自记一个开始时间，
        // 超过阈值还没动静就弹「重试」，别让人对着转圈干等。
        fetchAt: 0, loadAt: 0, videoReady: false, retryFn: null,
        // 通用
        resumeAt: 0, autoplay: true,
        blank: false,             // 启动空白态：还没有选视频，整块黑底白字（v1.6.8）
        duration: 0, cur: 0, playing: false,
        // 收起态：只留一条控制条（点 ▾ 收起，点 ⤢ 展开）
        collapsed: false, hPrev: 0,
        gearOn: false, loginKey: "End",
        // 方向键全局由主脚本接管（收到 init 的 keysGlobal 才置 true，默认这里留 false，
        // 万一钩子挂了页面这边还能自己处理）
        keyGlobal: false, holdKeyLabel: "",
        // 键位表（v1.6.15）：主脚本下发，侧栏「键」面板按它渲染
        keys: [], keysCap: "",
        hotkeyTip: "",
        // 看完自动续播（v1.6.16）：一集播完倒计时 N 秒切下一个
        autoNext: true, autoNextSec: 10,   // v1.6.17：默认 10 秒（5 秒太赶）
        nxTarget: null, nxAt: 0, nxTimer: null, nxTotal: 0
      };

      var stage = document.getElementById("stage");
      var v = document.getElementById("v");
      var cutFlash = document.getElementById("cutFlash");
      var bar = document.getElementById("bar");
      var markTicks = document.getElementById("markTicks");
      var rzList = Array.prototype.slice.call(document.querySelectorAll(".rz"));
      var overlay = document.getElementById("overlay");
      var side = document.getElementById("side");
      var dmLayer = document.getElementById("dm");
      var subEl = document.getElementById("sub");
      var collSel = document.getElementById("collSel");
      var epList = document.getElementById("epList");
      var catList = document.getElementById("catList");
      var crumb = document.getElementById("crumb");
      var crumbWho = document.getElementById("crumbWho");
      var crumbHint = document.getElementById("crumbHint");
      var sideMsg = document.getElementById("sideMsg");
      var progress = document.querySelector("#progress > i");
      var toastEl = document.getElementById("toast");
      var hintEl = document.getElementById("hint");
      var lblTime = document.getElementById("lblTime");
      var lblSpeed = document.getElementById("lblSpeed");
      var lblAlpha = document.getElementById("lblAlpha");
      var btnPlay = document.getElementById("btnPlay");
      var btnMute = document.getElementById("btnMute");
      var gearEl = document.getElementById("gear");

      /* ================= 与 BetterGI 通信 ================= */
      var channelWired = false;

      function post(url, data) {
        var payload;
        try { payload = JSON.stringify({ url: url, data: data || {} }); } catch (e) { return; }
        try {
          if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
            window.chrome.webview.postMessage(payload);
            return;
          }
        } catch (e) { }
        if (window.htmlMask && typeof window.htmlMask.postMessage === "function") {
          try { window.htmlMask.postMessage(payload); return; } catch (e) { }
        }
        console.log("[VideoMask] 无法回传：" + payload);
      }

      /* 键盘焦点上报：现在只当诊断用。
         实测这个 WebView2（BGI 的 HtmlMaskWindow）里，主脚本那句 Activate() 并不会让页面
         拿到键盘焦点 —— 得点一下页面（或用方向键之前先点一下）才会触发这个 focus 事件。
         所以主脚本【不再】根据它判断"要不要把鼠标还给游戏"：v1.6.5 那么干的后果是
         按一下 Insert 进缩放模式，1.2 秒后鼠标自己跳回游戏中心。留着只为了确认焦点事件
         到底有没有发生（真拿到焦点时主脚本日志会打一行）。 */
      window.addEventListener("focus", function () { post("/focus", { on: true }); });
      window.addEventListener("blur", function () {
        post("/focus", { on: false });
        // v1.6.28：焦点回到游戏（人已经"进游戏界面"了）→ 系列栏顺手收回。
        // 注意 closeSideIfOpen 定义在后面，这里的闭包在事件触发时才求值，没问题。
        if (S.interactive && S.showSide) closeSideIfOpen();
      });

      function tryHtmlMaskChannel() {
        if (!window.htmlMask) return false;
        try {
          var fn = function (msg) { onMessage(msg); };
          window.htmlMask.onMessage = fn;
          if (window.htmlMask.onMessage === fn) return true;
        } catch (e) { }
        return false;
      }

      function tryWebViewChannel() {
        try {
          if (window.chrome && window.chrome.webview && window.chrome.webview.addEventListener) {
            window.chrome.webview.addEventListener("message", function (ev) {
              var m = null;
              try { m = JSON.parse(ev.data); } catch (e) { return; }
              onMessage(m);
            });
            return true;
          }
        } catch (e) { }
        return false;
      }

      function wireChannel() {
        if (channelWired) return true;
        if (tryHtmlMaskChannel() || tryWebViewChannel()) {
          channelWired = true;
          return true;
        }
        return false;
      }

      function onMessage(msg) {
        if (!msg || !msg.url) return;
        var d = msg.data || {};
        switch (msg.url) {
          case "/init": applyInit(d); break;
          case "/cmd": applyCmd(d.a, d.v); break;
          case "/collections": renderCollections(d); break;
          case "/episodes": renderEpisodes(d); break;
          case "/catalog-index": onCatalogIndex(d); break;
          case "/catalog-region": onCatalogRegion(d); break;
          case "/catalog-find": onCatalogFind(d); break;
          case "/catalog-state": onCatalogState(d); break;
          case "/danmaku": onDanmaku(d); break;
          case "/meta": onMeta(d); break;
          case "/marks":
            S.marks = (d.list && d.list.length !== undefined) ? d.list.slice() : [];
            renderMarks();
            break;
          case "/playurl": onPlayurl(d); break;
          case "/local":
            S.locals = (d.files && d.files.length) ? d.files.slice() : [];
            if (S.view === "catalog" && !S.catSel) renderCatList();
            break;
          case "/subtitle": onSubtitle(d); break;
          case "/metric": onMetric(d); break;
          case "/keys": onKeys(d); break;
          case "/keycap": onKeyCap(d); break;
          case "/autonext":
            // 主脚本回话：同步开关与秒数（秒数可能是设置里改过的 7/10）
            S.autoNext = d.on !== false;
            S.autoNextSec = clamp(num(d.sec, S.autoNextSec || 10), 3, 30);
            syncAutoNextBtn();
            break;
          default: break;
        }
      }

      /* ================= 工具 ================= */
      function num(v, def) {
        var n = Number(v);
        return isFinite(n) ? n : def;
      }
      function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
      function fmt(sec) {
        sec = Math.max(0, Math.floor(sec || 0));
        var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        var mm = (m < 10 ? "0" + m : m), ss = (s < 10 ? "0" + s : s);
        return (h > 0 ? (h + ":") : "") + mm + ":" + ss;
      }
      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      /* ================= 初始化 ================= */
      function applyInit(d) {
        if (d.layout) {
          S.x = num(d.layout.x, S.x);
          S.y = num(d.layout.y, S.y);
          S.w = num(d.layout.w, S.w);
          S.h = num(d.layout.h, S.h);
        }
        S.fitRes = d.fitRes !== false;
        S.needDefault = (S.x < 0 || S.y < 0);
        restoreSaved(d);
        S.opacity = clamp(num(d.opacity, 1), 0.05, 1);
        S.speed = clamp(num(d.speed, 1), 0.25, 4);
        S.volume = clamp(num(d.volume, 1), 0, 1);
        S.hotkeyTip = d.hotkeyTip || "";
        S.upMid = d.upMid || "";
        S.sideHome = (d.sidebar !== false);
        S.showSide = S.sideHome;
        if (d.locals && d.locals.length !== undefined) S.locals = d.locals.slice();
        if (d.fav && d.fav.length !== undefined) S.fav = d.fav;
        if (d.stats && typeof d.stats === "object") S.stats = d.stats;
        S.subOn = d.showSubtitle !== false;
        S.qn = (num(d.qn, 64) === 16) ? 16 : 64;
        S.anOn = d.autoPause === true;        // 设置没给 / 给 false → 一律关（默认关）
        S.anMode = String(d.autoPauseMode || "cut");
        S.cutTh = clamp(num(d.autoPauseCut, 0.45), 0.2, 0.8);
        S.fightRatio = clamp(num(d.autoPauseFight, 2.0), 1.2, 3.5);
        S.marksOn = d.marksOn === true;      // 设置没给 / 给 false → 一律关（v1.6.22 起默认关）
        // 看完自动续播（v1.6.16）：默认开，秒数取设置（3~30，默认 5）
        S.autoNext = d.autoNext !== false;
        S.autoNextSec = clamp(num(d.autoNextSec, 10), 3, 30);
        S.voiceGate = d.voiceGate !== false;
        S.loginKey = d.loginKey ? String(d.loginKey) : "End";
        // 方向键归主脚本的全局钩子处理（v1.6.14）→ 页面自己别再动，否则浮窗有焦点时跳两下
        S.keyGlobal = d.keysGlobal === true;
        S.holdKeyLabel = d.holdKeyLabel ? String(d.holdKeyLabel) : "";
        // 键位表：主脚本启动时下发，侧栏「键」面板用它渲染（v1.6.15）
        S.keys = (d.keys && d.keys.length !== undefined) ? d.keys.slice() : S.keys;
        if (!S.voiceGate || !S.anOn) voiceKill("设置里关掉了");
        if (d.marks && d.marks.length !== undefined) S.marks = d.marks.slice();
        S.last = (d.lastWatch && typeof d.lastWatch === "object") ? d.lastWatch : null;
        renderMarks();
        syncAnBtn();
        setInteractive(d.interactive === true);
        applyLayout();
        applyOpacity();
        applyVolume();
        syncGear();
        if (d.showTip !== false) showHint(S.hotkeyTip, 14000);
        wireChannel();
        applySource(d.src || null, num(d.resume, 0), d.autoplay !== false);
        // 默认进「合集」视图：侧栏一打开就是枫丹/须弥这些卡片，点进去才是一条龙
        if (S.view === "catalog") openCatalog();
        layoutSide();
      }

      function applySource(src, resume, autoplay) {
        cancelAutoNext();        // 换源了，上一集的续播倒计时作废（v1.6.16）
        if (!src) {
          // v1.6.8：启动不再自动放视频，先给一张"先选地图"的黑屏提示。
          showBlank();
          return;
        }
        S.blank = false;
        stage.classList.remove("blank");
        S.autoplay = autoplay !== false;
        S.resumeAt = num(resume, 0);
        hideOverlay();
        // 换视频了：标题条先清空，等分P/元数据回来再填（免得上面挂着上一集的标题）
        S.curTitle = "";
        S.nowTitle = "";
        S.nowOpen = false;
        syncNowBar();

        if (src.kind === "bili") {
          S.isBili = true;
          S.bvid = src.bvid;
          S.page = num(src.page, 1) || 1;
          S.retried = 0;
          S.pages = [];
          renderPages();
          // 换视频时重新试一次带 CORS 抓帧（上次可能只是网络抖动导致降级）
          S.noCors = false;
          try { v.setAttribute("crossorigin", "anonymous"); } catch (e) { }
          var t0 = S.resumeAt > 1 ? S.resumeAt : num(src.t, 0);
          requestPlayurl(t0, autoplay !== false);
          markCurrentEpisode();
          updateFavStar();
          // 弹幕按需拉（默认关，跑图用不上，省两个请求）
          S.dmList = []; S.dmCursor = 0; S.dmLastT = -1;
          if (S.dmOn) post("/api/danmaku", { bvid: S.bvid });
          S.subs = []; S.subIdx = -1;
          post("/api/subtitle", { bvid: S.bvid });
          // 打怪点等 /playurl 回来后再要（那时才确定是第几P）
          S.marks = []; S.markPrev = -1; renderMarks();
          return;
        }

        S.isBili = false;
        S.pages = [];
        renderPages();
        if (src.kind === "url") loadVideo("", src.url, resume, autoplay);
        else loadVideo(src.file || "", "", resume, autoplay);
      }

      /* ==========================================================================
       * 在线：B 站直链自播
       *
       * 以前用 player.bilibili.com 的 iframe，跨域导致：拿不到进度、拖不了进度条、
       * 改不了倍速、抓不到画面、也不知道视频播到哪一帧。现在脚本侧调
       * x/player/playurl 取一整个 mp4 直链（platform=html5 给的是单文件、不是 DASH），
       * 直接塞进 <video>，上面这些能力就全回来了。
       *
       * 直链大约 2 小时过期，所以 error 时要能自己重新取一条并接着播。
       * ========================================================================== */

      function requestPlayurl(t, autoplay) {
        if (!S.bvid) return;
        S.fetching = true;
        S.fetchAt = Date.now();          // 卡住检测的起点
        S.wantPlay = autoplay !== false;
        showOverlay("正在取视频地址…");
        post("/api/playurl", {
          bvid: S.bvid,
          page: S.page,
          t: Math.round(Math.max(0, num(t, 0))),
          qn: S.qn
        });
      }

      function onPlayurl(d) {
        if (!d || !d.bvid || d.bvid !== S.bvid) return;     // 已经切走了
        S.fetching = false;

        if (d.error) {
          const e = String(d.error);
          // 按错误类型给对策，别一律甩"去勾权限"——412 是 B 站风控，跟权限无关，
          // 那句话只会把人带到沟里。
          let hint = "";
          if (/412/.test(e)) {
            hint = "412 是 B 站风控，不是权限问题。\n脚本已自动补 buvid3 重试过；仍失败就在设置里填 SESSDATA。";
          } else if (/不允许请求|权限|HTTP 权限/.test(e)) {
            hint = "到 BetterGI 设置 → 通用 勾上「JS HTTP 权限」，然后重新启用一次本脚本。";
          } else if (/DASH/.test(e)) {
            hint = "这个视频只提供 DASH 流，没有单文件 mp4，暂时播不了。";
          } else if (/HTTP 403|HTTP 404/.test(e)) {
            hint = "视频可能已失效，或者需要大会员画质。";
          }
          showOverlay("取不到播放地址：\n" + e + (hint ? "\n\n" + hint : ""));
          post("/log", { msg: "取直链失败：" + e });
          return;
        }

        S.cid = d.cid || "";
        S.pages = (d.pages && d.pages.length) ? d.pages : [];
        S.quality = num(d.quality, S.qn);
        hideOverlay();
        renderPages();

        pendingResume = Math.max(0, num(d.t, 0));
        pendingAutoplay = S.wantPlay !== false;
        S.retried = 0;
        // 分P 换了，打怪点跟着换（按 bvid + 分P 各存一份）
        S.marks = []; S.markPrev = -1;
        if (num(d.page, S.page) !== S.page) S.page = num(d.page, S.page);
        renderMarks();
        post("/api/marks", { bvid: S.bvid, page: S.page });
        v.src = d.url || "";
        S.loadAt = Date.now();
        S.videoReady = false;
        try { v.load(); } catch (e) { }
        if (num(d.total, 1) > 1) {
          toast("这个分P被切成 " + d.total + " 段，只能播第一段");
        }
      }

      /* ---------- 分P ---------- */
      function goPage(i) {
        i = Math.max(1, parseInt(i, 10) || 1);
        if (!S.isBili) return;
        if (i === S.page) { toast("已经是 P" + i); return; }
        S.page = i;
        S.retried = 0;
        requestPlayurl(0, true);
        toast("切到 P" + i);
      }

      function switchPage(dir) {
        if (!S.isBili || !S.pages.length) return false;
        var idx = -1;
        for (var i = 0; i < S.pages.length; i++) {
          if (S.pages[i].i === S.page) { idx = i; break; }
        }
        if (idx < 0) return false;
        var next = idx + (dir < 0 ? -1 : 1);
        if (next < 0 || next >= S.pages.length) return false;
        goPage(S.pages[next].i);
        return true;
      }

      /* ---------- 当前视频标题条（v1.6.10） ----------
       * 这一集的完整标题以前混在分P列表里（「至冬7.0 一条龙」那种一条占三行），
       * 31 个分P 一屏只能看到三四条。现在它固定在面包屑下面单独一行，
       * 列表里每行标题只留一行，点这条可以展开/收起全文。
       */
      function nowTitleText() {
        // 分P 标题最准：同一个 BV 下 31 个 P 各叫各的
        for (var i = 0; i < S.pages.length; i++) {
          if (S.pages[i].i === S.page && S.pages[i].title) return S.pages[i].title;
        }
        return S.curTitle || "";
      }

      function syncNowBar() {
        var bar = document.getElementById("nowBar");
        if (!bar) return;
        var ti = document.getElementById("nowTi");
        if (ti) {
          // 有分P 就带上 P 号（从列表里挪出来后，还得知道自己在第几段）
          var pre = (S.pages && S.pages.length > 1) ? ("P" + S.page + " · ") : "";
          ti.textContent = S.nowTitle ? (pre + S.nowTitle) : "";
        }
        // 只在第四层（点进某一集、看分P）时显示：
        // 前面三层只放一层内容，不挂「当前 P2」，也不挂分P 列表
        var show = !!S.nowTitle && S.view === "catalog" && !!S.catSel && !!S.catKind && !!S.catBvid;
        bar.className = (show ? "show" : "") + (S.nowOpen ? " open" : "");
      }

      function setNowTitle(t) {
        S.nowTitle = String(t || "");
        syncNowBar();
      }

      function renderPages() {
        var box = document.getElementById("sidePages");
        // 标题条跟着刷新（分P 数据到了才知道这一 P 到底叫什么）
        setNowTitle(nowTitleText());
        if (!box) return;
        box.innerHTML = "";
        if (!S.isBili || !S.pages || S.pages.length <= 1) {
          box.className = "";
          if (S.view === "catalog" && S.catBvid) sideMsg.textContent = "这个视频只有 1 个 P，没有分段";
          return;
        }
        box.className = "show";
        // 第四层：状态栏报「第几个 P」，比"一条龙 · 4 个"有用
        if (S.view === "catalog" && S.catBvid) {
          sideMsg.textContent = "P" + S.page + " / 共 " + S.pages.length + " 个";
        }
        box.appendChild(el("div", "ph", "本视频分P（共 " + S.pages.length + " 个）"));
        for (var i = 0; i < S.pages.length; i++) {
          (function (p) {
            var row = el("div", "ep" + (p.i === S.page ? " cur" : ""));
            row.appendChild(el("span", "no", "P" + p.i));
            var ti = el("span", "ti", p.title || "");
            ti.setAttribute("title", p.title || "");   // 单行省略了，鼠标停上去看全文
            row.appendChild(ti);
            if (p.dur) row.appendChild(el("span", "du", fmt(p.dur)));
            row.addEventListener("click", function () { goPage(p.i); });
            box.appendChild(row);
          })(S.pages[i]);
        }
      }

      /* ================= 侧栏 ================= */

      /* ---------- 分类视图：三级钻取 ----------
       *   一级：合集/地区卡片（枫丹 / 须弥 / 璃月…）
       *   二级：这个合集里的「一条龙」（一条龙 / 宝箱 / 神瞳 / 主线…）
       *   三级：这条一条龙下面的视频列表，点一个直接播
       *
       * 以前是两级：点地区直接把所有类型的视频上下堆一屏（几百条滚到底）。
       * 用户明确说了不要那种"上下式"，要一级一级点进去、能返回。
       */

      /**
       * 现在停在第几层：
       *   0 地区（至冬 / 纳塔 / 枫丹…）
       *   1 类型（一条龙 / 宝箱 / 神瞳 / 主线…）
       *   2 版本（纳塔5.0 / 纳塔5.2…这些具体视频）
       *   3 分P（P1 / P2…，只有到这一层才显示「当前 P2」和分P 列表）
       *   -1 不在分类视图里（B 站系列视图）
       *
       * 用户明确要求：一层只放一样东西 —— 上面一层是分类就不要在下面挂「当前 P2」，
       * 也不要分上下两块。要看到分P，就得点进具体那一集。
       */
      function catLevel() {
        if (S.view !== "catalog") return -1;
        if (!S.catSel) return 0;
        if (!S.catKind) return 1;
        return S.catBvid ? 3 : 2;
      }

      function layoutCatView() {
        var lv = catLevel();
        var isCat = lv >= 0;

        // 四个容器各管一层：地区卡片（catList） / 类型卡片·版本列表（epList） / 分P（sidePages）
        catList.className = (lv === 0) ? "show" : "";
        epList.style.display = (lv === 1 || lv === 2) ? "" : (isCat ? "none" : "");
        crumb.className = (lv >= 1) ? "show" : "";

        if (lv === 1) {
          crumbWho.textContent = S.catSel;
          if (crumbHint) crumbHint.textContent = "回到分类";
        } else if (lv === 2) {
          crumbWho.textContent = S.catSel + " / " + S.catKind;
          if (crumbHint) crumbHint.textContent = "回到 " + S.catSel;
        } else if (lv === 3) {
          crumbWho.textContent = S.catSel + " / " + S.catKind;
          if (crumbHint) crumbHint.textContent = "回到视频列表";
        }

        // 分P 只在第四层露面：前三层就算正在放着视频也不挂出来（这就是"不要分屏"）
        // 系列视图（-1）照旧：有分P 就显示，这是原来一直在用的行为
        var pg = document.getElementById("sidePages");
        if (pg) {
          if (isCat && lv < 3) pg.className = "";
          else renderPages();
        }
        // 让样式知道现在在第几层（第四层分P 要撑满整块）
        var sb = document.getElementById("side");
        if (sb && sb.setAttribute) sb.setAttribute("data-lv", String(lv));
        syncNowBar();
      }

      function openCatalog() {
        S.view = "catalog";
        S.catSel = "";
        S.catKind = "";
        S.catBvid = "";
        S.catLocal = false;
        layoutCatView();
        renderCatList();
        if (!S.catGroups.length) {
          S.catBusy = true;
          S.catMsg = "正在建立分类索引…（第一次要十几秒；之后启动会自动预建，基本秒开）";
          renderCatList();
          post("/api/catalog", {});
        }
      }

      /** 一级：回到「枫丹 / 须弥 / 璃月」这些合集卡片 */
      function backToCatalog() {
        S.catSel = "";
        S.catKind = "";
        S.catBvid = "";
        S.catLocal = false;
        S.view = "catalog";
        layoutCatView();
        renderCatList();
      }

      /**
       * 返回上一层：分P → 版本视频 → 类型 → 地区列表。
       * 面包屑和「分」按钮都用它（一层一层退，不是一步跳回顶层）。
       */
      function catBack() {
        if (S.view !== "catalog") return false;
        if (S.catBvid) {          // 第四层 → 第三层（重画视频列表，保证是这一类的）
          S.catBvid = "";
          layoutCatView();
          renderCatVideos();
          return true;
        }
        if (S.catKind) {
          S.catKind = "";
          layoutCatView();
          renderCatKinds(S.catSel, S.catItems);
          return true;
        }
        if (S.catSel) { backToCatalog(); return true; }
        return false;
      }

      function setViewSeries() {
        if (S.view !== "catalog") return;
        S.view = "series";
        S.catSel = "";
        S.catKind = "";
        S.catBvid = "";
        layoutCatView();     // 分类的四个容器收起来，分P 按当前视频重画
        // 分集列表在分类视图期间被"扣住"了，切回来时补画一次
        if (S.epLast) renderEpisodes(S.epLast);
        else if (S.curId) requestEpisodes(S.curKind, S.curId, S.epPage);
      }

      function renderCatList() {
        catList.innerHTML = "";

        /* ---------- 本地视频（v1.6.26）----------
           自己往 assets/videos 里扔的 mp4，主脚本扫出来推过来，这里直接列成一栏点播。
           以前只能在设置里手打文件名，等于没有这个功能。 */
        if (S.catLocal) {
          var bak = el("div", "cat");
          var bkr = el("div", "row1");
          bkr.appendChild(el("span", "nm", "← 返回分类"));
          bak.appendChild(bkr);
          bak.addEventListener("click", function () {
            S.catLocal = false;
            layoutCatView();
            renderCatList();
          });
          catList.appendChild(bak);

          if (!S.locals.length) {
            catList.appendChild(el("div", "ph",
              "assets/videos 里还没有视频。\n把 mp4 放进去，再点上面的 ↻ 刷新。"));
            return;
          }
          for (var li = 0; li < S.locals.length; li++) {
            (function (name) {
              var row = el("div", "cat");
              var r1 = el("div", "row1");
              r1.appendChild(el("span", "nm", name));
              row.appendChild(r1);
              row.addEventListener("click", function () { playLocal(name); });
              catList.appendChild(row);
            })(S.locals[li]);
          }
          return;
        }

        // 顶层：有本地视频就先给一个入口卡片
        if (S.locals.length) {
          var lrow = el("div", "cat");
          var lr1 = el("div", "row1");
          lr1.appendChild(el("span", "nm", "本地视频"));
          lr1.appendChild(el("span", "ct", S.locals.length + " 个"));
          lrow.appendChild(lr1);
          lrow.appendChild(el("div", "kd", "assets/videos 里自己放的文件"));
          lrow.addEventListener("click", function () { openLocal(); });
          catList.appendChild(lrow);
        }

        if (S.catBusy) {
          catList.appendChild(el("div", "ph", S.catMsg || "正在建立分类索引…"));
          return;
        }
        if (!S.catGroups.length) {
          catList.appendChild(el("div", "ph", S.catMsg || "还没有分类数据"));
          return;
        }
        for (var i = 0; i < S.catGroups.length; i++) {
          (function (g) {
            var row = el("div", "cat");
            var r1 = el("div", "row1");
            r1.appendChild(el("span", "nm", g.name));
            if (g.parent) r1.appendChild(el("span", "pa", "（" + g.parent + "）"));
            r1.appendChild(el("span", "ct", g.total + " 个"));
            row.appendChild(r1);
            var tags = [];
            for (var k = 0; k < g.kinds.length; k++) tags.push(g.kinds[k].name + " " + g.kinds[k].n);
            row.appendChild(el("div", "kd", tags.join(" · ")));
            row.addEventListener("click", function () { openCatRegion(g.name); });
            catList.appendChild(row);
          })(S.catGroups[i]);
        }
      }

      /** 打开「本地视频」这一层 */
      function openLocal() {
        S.catLocal = true;
        S.catSel = "";
        S.catKind = "";
        S.catBvid = "";
        S.view = "catalog";
        layoutCatView();
        if (!S.locals.length) post("/api/local", {});   // 兜底：主脚本还没推过来
        renderCatList();
      }

      /** 点本地视频：直接切过去播 */
      function playLocal(name) {
        if (!name) return;
        S.catLocal = false;
        applySource({ kind: "file", file: name, spec: name, label: name }, 0, true);
        if (S.sidePinned) closeSide();
        toast("本地视频：" + name);
      }

      /** 一级 → 二级：点合集卡片，拉这个合集下的全部条目，先只列「一条龙」 */
      function openCatRegion(name) {
        S.view = "catalog";
        S.catSel = name;
        S.catKind = "";
        S.catBvid = "";
        layoutCatView();
        epList.innerHTML = "";
        epList.appendChild(el("div", "ph", "加载中…"));
        post("/api/catalog", { region: name });
      }

      function onCatalogIndex(d) {
        S.catGroups = (d && d.groups) || [];
        S.catTotal = (d && d.total) || 0;
        S.catBusy = false;
        S.catMsg = S.catGroups.length ? "" : "没有索引到内容，点 ↻ 重建";
        if (S.view === "catalog" && !S.catSel) renderCatList();
        sideMsg.textContent = S.catGroups.length
          ? ("分类 " + S.catGroups.length + " 个 · " + ((d && d.total) || 0) + " 个视频")
          : S.catMsg;
      }

      function onCatalogState(d) {
        if (!d) return;
        if (d.running) {
          S.catBusy = true;
          S.catMsg = d.msg || "正在索引…";
        } else {
          S.catBusy = false;
          S.catMsg = d.error ? ("索引失败：" + d.error) : "索引完成";
        }
        if (S.view === "catalog" && !S.catSel) renderCatList();
        // 成功时 /catalog-index 已经写了「分类 N 个 · M 个视频」，别再用「索引完成」盖掉它
        if (d.running || d.error || !S.catGroups.length) sideMsg.textContent = S.catMsg;
      }

      function onCatalogRegion(d) {
        if (!d || d.region !== S.catSel) return;
        // 停在第四层（看分P）时只需要把条目存下来备用，别拿类型卡片把屏幕盖了
        if (catLevel() === 3) {
          S.catItems = d.items || [];
          return;
        }
        renderCatKinds(d.region, d.items || []);
      }

      /**
       * 重新打开侧栏时，直接停到「正在看的那一集」的分P 层。
       *
       * 用户：关掉系列栏再点开，应该直接回到我在看的那一集，而不是又回到地区列表。
       * 手上已有的条目先查（进过那个地区就有），查不到就问主脚本 —— 完整索引在它那边。
       */
      function locateCurrent() {
        if (S.view !== "catalog" || !S.isBili || !S.bvid) return false;
        if (S.catBvid === S.bvid && S.catSel) { layoutCatView(); return true; }
        for (var i = 0; i < S.catItems.length; i++) {
          if (S.catItems[i].bvid !== S.bvid) continue;
          var it = S.catItems[i];
          S.catSel = it.region || S.catSel;
          S.catKind = it.kind || "其他";
          S.catBvid = it.bvid;
          layoutCatView();
          return true;
        }
        post("/api/catalog-find", { bvid: S.bvid });
        return false;
      }

      /** 主脚本回话：这一集属于哪个地区 / 哪一类 */
      function onCatalogFind(d) {
        if (!d || !d.bvid || d.bvid !== S.bvid) return;
        if (!d.region) return;        // 不在索引里（比如系列视图里的合集视频），保持原样
        S.view = "catalog";
        S.catSel = d.region;
        S.catKind = d.kind || "其他";
        S.catBvid = d.bvid;
        layoutCatView();
        // 返回上一层要看视频列表，手上没有这个地区的条目就补拉一次
        if (!S.catItems.length || S.catItems[0] && S.catItems[0].region !== d.region) {
          post("/api/catalog", { region: d.region });
        }
      }

      /**
       * 二级：把这个合集里的条目按「一条龙」类型分成卡片。
       * 主脚本送过来的 items 已经按类型顺序排好（一条龙 → 宝箱 → 神瞳 → 主线 → …），
       * 这里只按出现顺序收拢，不再重新排序。
       */
      function renderCatKinds(region, items) {
        S.catItems = items || [];
        epList.innerHTML = "";
        if (!S.catItems.length) {
          epList.appendChild(el("div", "ph", "「" + region + "」下还没有视频"));
          sideMsg.textContent = "0 个";
          return;
        }
        var names = [], byKind = {};
        for (var i = 0; i < S.catItems.length; i++) {
          var it = S.catItems[i];
          var k = it.kind || "其他";
          if (!byKind[k]) { byKind[k] = []; names.push(k); }
          byKind[k].push(it);
        }
        for (var n = 0; n < names.length; n++) {
          (function (k, list) {
            var row = el("div", "cat");
            var r1 = el("div", "row1");
            r1.appendChild(el("span", "nm", k));
            r1.appendChild(el("span", "ct", list.length + " 个"));
            row.appendChild(r1);
            // 预览：第一个视频的标题（大多数就是「xxx 一条龙」）
            var first = list[0];
            row.appendChild(el("div", "kd", first.title || first.bvid));
            row.addEventListener("click", function () { openCatKind(region, k); });
            epList.appendChild(row);
          })(names[n], byKind[names[n]]);
        }
        sideMsg.textContent = region + " · " + names.length + " 条一条龙 · " + S.catItems.length + " 个视频";
        epList.scrollTop = 0;
      }

      /**
       * 第三层 → 第四层：点某一集（比如「纳塔5.0 一条龙」）→ 播它，
       * 这时才显示「当前 P2」和分P 列表。前三层不会挂这些东西。
       */
      function enterCatVideo(it) {
        if (!it) return;
        S.view = "catalog";
        if (it.region) S.catSel = it.region;
        if (it.kind) S.catKind = it.kind || "其他";
        S.catBvid = it.bvid;
        layoutCatView();
        if (it.bvid !== S.bvid) playBvid(it.bvid);
      }

      /** 第三层的内容：这一类下的视频列表（各个版本：5.0 / 5.2 …），点一条进第四层 */
      function renderCatVideos() {
        var kind = S.catKind;
        var items = [];
        for (var i = 0; i < S.catItems.length; i++) {
          if ((S.catItems[i].kind || "其他") === kind) items.push(S.catItems[i]);
        }
        epList.innerHTML = "";
        if (!items.length) {
          epList.appendChild(el("div", "ph", "「" + kind + "」下没有视频"));
          return;
        }
        for (var j = 0; j < items.length; j++) {
          (function (it, no) {
            var row = el("div", "ep");
            row.setAttribute("data-bvid", it.bvid);
            row.appendChild(el("span", "no", no + "."));
            var ti = el("span", "ti", it.title || it.bvid);
            ti.setAttribute("title", it.title || it.bvid);   // 单行省略，悬停看全文
            row.appendChild(ti);
            if (it.dur) row.appendChild(el("span", "du", fmt(it.dur)));
            // 点进这一集 → 第四层（分P）
            row.addEventListener("click", function () { enterCatVideo(it); });
            epList.appendChild(row);
          })(items[j], j + 1);
        }
        sideMsg.textContent = kind + " · " + items.length + " 个";
        markCurrentEpisode();
        epList.scrollTop = 0;
      }

      /** 二级 → 三级：点一条龙，列出它下面的视频（各个版本：5.0 / 5.2 …） */
      function openCatKind(region, kind) {
        S.catKind = kind;
        S.catBvid = "";
        layoutCatView();
        renderCatVideos();
      }

      function renderCollections(d) {
        S.collections = d || null;
        rebuildSelect();
        var seasons = (d && d.seasons) || [];
        var series = (d && d.series) || [];
        if (!seasons.length && !series.length) {
          if (S.view === "series") sideMsg.textContent = "没有取到合集（检查 JS HTTP 权限）";
          return;
        }

        // 优先选名字里带「一条龙」的那个
        var prefer = null;
        for (var k = 0; k < series.length; k++) {
          if (series[k].name.indexOf("一条龙") >= 0) { prefer = series[k]; break; }
        }
        if (!prefer) prefer = series[0] || seasons[0];
        if (prefer) {
          collSel.value = prefer.kind + ":" + prefer.id;
          requestEpisodes(prefer.kind, prefer.id, 1);
        }
        // 分类视图下状态栏归分类用，别被"合集 N / 系列 M"盖掉
        sideMsg.textContent = (S.view === "catalog")
          ? catalogStatusText()
          : ("合集 " + seasons.length + " / 系列 " + series.length);
      }

      /** 分类视图下状态栏该显示什么（索引进度 / 数量），被几处共用 */
      function catalogStatusText() {
        if (S.catBusy) return S.catMsg || "正在建立分类索引…";
        if (!S.catGroups.length) return S.catMsg || "还没有分类数据";
        return "分类 " + S.catGroups.length + " 个" +
          (S.catTotal ? (" · " + S.catTotal + " 个视频") : "");
      }

      function rebuildSelect() {
        var keep = collSel.value;
        collSel.innerHTML = "";
        var seasons = (S.collections && S.collections.seasons) || [];
        var series = (S.collections && S.collections.series) || [];
        var favs = [];
        for (var i = 0; i < S.fav.length; i++) {
          favs.push({ id: S.fav[i].bvid, name: S.fav[i].title || S.fav[i].bvid, total: 0 });
        }

        function addGroup(label, arr, kind) {
          if (!arr.length) return;
          var g = document.createElement("optgroup");
          g.label = label;
          for (var i = 0; i < arr.length; i++) {
            var o = document.createElement("option");
            o.value = kind + ":" + arr[i].id;
            o.textContent = arr[i].name + (arr[i].total ? ("（" + arr[i].total + "）") : "");
            g.appendChild(o);
          }
          collSel.appendChild(g);
        }
        addGroup("收藏", favs, "fav");
        addGroup("系列", series, "series");
        addGroup("合集", seasons, "season");
        if (keep) collSel.value = keep;
      }

      function requestEpisodes(kind, id, page) {
        S.curKind = kind;
        S.curId = id;
        S.epPage = page || 1;
        if (S.view === "series") sideMsg.textContent = "加载中…";
        post("/api/episodes", { kind: kind, id: id, page: S.epPage });
      }

      function renderEpisodes(d) {
        S.epLast = d || null;
        var items = (d && d.items) || [];

        // v1.6.8：删掉"没配置视频源就自动播合集第一集" —— 那等于一打开侧栏就自己放，
        // 跟"启动不要自动放视频"是一回事。现在点了哪一集才播哪一集。
        // 分类视图（合集 → 一条龙 → 视频）下 epList 归分类用，别被合集分集盖掉
        if (S.view !== "series") return;

        S.epTotal = num(d && d.total, 0);
        epList.innerHTML = "";
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          var row = el("div", "ep");
          row.setAttribute("data-bvid", it.bvid);
          var no = (S.epPage - 1) * 30 + i + 1;
          row.appendChild(el("span", "no", no + "."));
          var ti = el("span", "ti", it.title || it.bvid);
          ti.setAttribute("title", it.title || it.bvid);   // 单行省略，悬停看全文
          row.appendChild(ti);
          if (it.dur) row.appendChild(el("span", "du", fmt(it.dur)));
          row.addEventListener("click", function () {
            var bv = this.getAttribute("data-bvid");
            if (!bv) return;
            playBvid(bv);
          });
          epList.appendChild(row);
        }
        sideMsg.textContent = "第 " + S.epPage + " 页 · 共 " + S.epTotal + " 集";
        markCurrentEpisode();
        epList.scrollTop = 0;
      }

      function playBvid(bv) {
        if (!bv) return;
        if (S.bvid === bv) { closeSideIfOpen(); toast("已经在播这一集了"); return; }
        applySource({ kind: "bili", bvid: bv, page: 1, t: 0 }, 0, true);
        // 选完就收：抬手点下一集是下一轮操作，系列栏没必要一直占着屏幕
        closeSideIfOpen();
        toast("开始播放：" + bv);
      }

      function markCurrentEpisode() {
        var rows = epList.children;
        for (var i = 0; i < rows.length; i++) {
          var cur = rows[i].getAttribute("data-bvid") === S.bvid;
          rows[i].className = cur ? "ep cur" : "ep";
        }
      }

      function openSide() {
        S.showSide = true;
        S.sidePinned = true;
        post("/pin", { on: true });       // 让脚本别急着切回穿透，否则侧栏点不到
        // 主脚本启动时就在后台拉了合集/分类索引，正常不会走到这两个兜底；
        // 万一设置里关了自动加载或者那次请求失败了，打开侧栏时补一次。
        if (!S.collections) post("/api/collections", {});
        if (S.view === "catalog" && !S.catGroups.length && !S.catBusy) {
          S.catBusy = true;
          S.catMsg = "正在建立分类索引…";
          renderCatList();
          post("/api/catalog", {});
        }
        // 打开侧栏就落在"正在看的那一集"（第四层，分P）
        locateCurrent();
        layoutSide();
      }

      function closeSide() {
        S.showSide = false;
        S.sidePinned = false;
        post("/pin", { on: false });
        layoutSide();
      }

      /**
       * v1.6.28：系列栏是"临时挑片"的工具，不是常驻面板。
       * 选完视频、松开 Alt、或者浮窗失去可交互，都该把它收回去 ——
       * 不然它会一直挂在画面下面挡视野，还得再点一次 ⧉ 才关得掉。
       */
      function closeSideIfOpen() {
        if (S.showSide) closeSide();
      }

      function layoutSide() {
        var show = S.showSide && S.interactive && !S.collapsed;
        // 系列栏显示状态一变就强制上报一次几何：主脚本靠 side 矩形判断
        // "鼠标还在不在浮窗上"，这个矩形必须是实的（开）或者立刻清掉（关），
        // 中途被 120ms 节流吞掉的话，会出现"面板开着却被当成鼠标已移出"。
        var changed = (show !== !!S.sideShown);
        S.sideShown = show;
        side.className = show ? "show" : "";
        if (!show) { if (changed) reportGeom(true); else reportGeom(); return; }
        var gap = 6;
        var w = Math.max(280, Math.round(S.w));
        var left = clamp(Math.round(S.x), gap, Math.max(gap, window.innerWidth - w - gap));
        // 系列栏放在"视频 + 弹幕带"的下面
        var top = Math.round(S.y + S.h + gap + DM_H + gap);
        if (top > window.innerHeight - 160) top = Math.max(gap, window.innerHeight - 160);
        var h = Math.max(150, window.innerHeight - top - gap);
        side.style.left = left + "px";
        side.style.top = top + "px";
        side.style.width = w + "px";
        side.style.height = Math.round(h) + "px";
        S.sideX = left; S.sideY = top; S.sideW = w; S.sideH = Math.round(h);
        if (changed) reportGeom(true); else reportGeom();
      }

      /* ================= 弹幕投影 ================= */
      function currentTime() {
        return v.currentTime || 0;
      }

      function dmSeekIndex(t) {
        var lo = 0, hi = S.dmList.length;
        while (lo < hi) {
          var mid = (lo + hi) >> 1;
          if (S.dmList[mid].t < t) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      }

      function onMeta(d) {
        if (!d) return;
        if (d.bvid && S.bvid && d.bvid !== S.bvid) return;
        S.curTitle = d.title || "";
        setNowTitle(nowTitleText());   // 标题条跟着换（v1.6.10）
        updateFavStar();
      }

      function onDanmaku(d) {
        if (!d || !d.bvid || d.bvid !== S.bvid) return;   // 已经切走了
        S.dmList = d.items || [];
        S.dmLastT = currentTime();
        S.dmCursor = dmSeekIndex(S.dmLastT);
        if (S.dmOn) toast("弹幕已加载 " + S.dmList.length + " 条");
      }

      function dmTick() {
        if (!S.dmOn || !S.dmList.length) return;
        var now = currentTime();
        // 跳转/暂停后重新定位游标
        if (S.dmLastT < 0 || Math.abs(now - S.dmLastT) > 2.5) {
          S.dmCursor = dmSeekIndex(now);
          S.dmLastT = now;
          return;
        }
        var guard = 0;
        while (S.dmCursor < S.dmList.length && S.dmList[S.dmCursor].t <= now && guard++ < 40) {
          var it = S.dmList[S.dmCursor++];
          if (now - it.t <= 1.5) spawnDm(it);
        }
        S.dmLastT = now;
      }

      function spawnDm(it) {
        if (S.dmNodes > 60) return;      // 防止刷屏卡顿
        var e = document.createElement("div");
        e.className = "dmi";
        e.textContent = it.x;
        var col = it.c || 16777215;
        e.style.color = "#" + ("000000" + col.toString(16)).slice(-6);
        e.style.top = (3 + Math.floor(Math.random() * (DM_H - 26))) + "px";
        e.style.animationDuration = (7 + Math.random() * 4).toFixed(2) + "s";
        S.dmNodes++;
        e.addEventListener("animationend", function () {
          if (e.parentNode) e.parentNode.removeChild(e);
          S.dmNodes--;
        });
        dmLayer.appendChild(e);
      }

      function toggleDm() {
        S.dmOn = !S.dmOn;
        dmLayer.className = S.dmOn ? "show" : "";
        if (S.dmOn && !S.dmList.length && S.bvid) {
          post("/api/danmaku", { bvid: S.bvid });
          toast("正在加载弹幕…");
        } else {
          toast(S.dmOn ? "弹幕已开" : "弹幕已关");
        }
      }

      /* ================= 收藏夹 ================= */
      function favIndex(bv) {
        for (var i = 0; i < S.fav.length; i++) if (S.fav[i].bvid === bv) return i;
        return -1;
      }

      function updateFavStar() {
        var btn = document.getElementById("btnFav");
        if (!btn) return;
        btn.textContent = (S.bvid && favIndex(S.bvid) >= 0) ? "★" : "☆";
        btn.style.color = (S.bvid && favIndex(S.bvid) >= 0) ? "#ffd24a" : "";
      }

      function toggleFav() {
        if (!S.isBili || !S.bvid) { toast("只能收藏在线视频"); return; }
        var i = favIndex(S.bvid);
        if (i >= 0) {
          S.fav.splice(i, 1);
          toast("已取消收藏");
        } else {
          S.fav.unshift({ bvid: S.bvid, title: S.curTitle || S.bvid });
          toast("已收藏：" + (S.curTitle || S.bvid));
        }
        post("/fav", { list: S.fav });
        rebuildSelect();
        updateFavStar();
      }

      /* ================= 肝度统计 ================= */
      function pad2(n) { return n < 10 ? ("0" + n) : String(n); }
      function dayKey(d) {
        return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
      }
      function isPlayingNow() {
        return !!v.src && !v.paused && !v.ended;
      }
      function humanDur(sec) {
        sec = Math.max(0, Math.round(sec));
        if (sec < 60) return sec + " 秒";
        var m = Math.round(sec / 60);
        if (m < 60) return m + " 分钟";
        return (m / 60).toFixed(1) + " 小时";
      }
      function showStats() {
        var today = 0, week = 0, all = 0;
        var now = Date.now();
        for (var k in S.stats) {
          if (!Object.prototype.hasOwnProperty.call(S.stats, k)) continue;
          var sec = Number(S.stats[k]) || 0;
          all += sec;
          if (k === dayKey(new Date())) today += sec;
          var t = Date.parse(k + "T00:00:00");
          if (isFinite(t) && now - t < 7 * 86400000) week += sec;
        }
        toast("今日 " + humanDur(today) + "　本周 " + humanDur(week) + "　累计 " + humanDur(all));
      }

      var statsDirty = false;
      setInterval(function () {
        if (!isPlayingNow()) return;
        var k = dayKey(new Date());
        S.stats[k] = (Number(S.stats[k]) || 0) + 1;
        statsDirty = true;
      }, 1000);
      setInterval(function () {
        if (!statsDirty) return;
        statsDirty = false;
        post("/stats", { days: S.stats });
      }, 15000);
      setInterval(function () { dmTick(); subTick(); }, 200);

      /* ================= 字幕 / 方向提示 ================= */
      var DIR_RULES = [
        { re: /(东北|右前|前右)/, a: "↗" },
        { re: /(西北|左前|前左)/, a: "↖" },
        { re: /(东南|右后|后右)/, a: "↘" },
        { re: /(西南|左后|后左)/, a: "↙" },
        { re: /(向东|往东|朝东|东边|东面|右侧|右边|往右|向右)/, a: "→" },
        { re: /(向西|往西|朝西|西边|西面|左侧|左边|往左|向左)/, a: "←" },
        { re: /(向北|往北|朝北|北边|北面|北上|直走|往前)/, a: "↑" },
        { re: /(向南|往南|朝南|南边|南面|南下|往回走|回头|返回)/, a: "↓" },
        { re: /(向上|往上|上面|上边|爬上去|起飞|风场)/, a: "⬆" },
        { re: /(向下|往下|下面|下边|跳下去|下去|落地)/, a: "⬇" }
      ];

      function onSubtitle(d) {
        if (!d || !d.bvid || d.bvid !== S.bvid) return;
        S.subs = d.items || [];
        S.subIdx = -1;
        if (!S.subs.length) {
          subEl.className = "";
          subEl.textContent = "";
        } else {
          toast("字幕已加载 " + S.subs.length + " 句");
        }
      }

      function directionOf(text) {
        for (var i = 0; i < DIR_RULES.length; i++) {
          if (DIR_RULES[i].re.test(text)) return DIR_RULES[i].a;
        }
        return "";
      }

      function subTick() {
        if (!S.subOn || !S.subs.length) return;
        var now = currentTime();
        var start = 0;
        if (S.subIdx >= 0 && S.subs[S.subIdx] && now >= S.subs[S.subIdx].f) start = S.subIdx;

        var found = -1;
        for (var i = start; i < S.subs.length; i++) {
          var s = S.subs[i];
          if (s.f > now + 0.2) break;
          if (now >= s.f && now <= s.t + 0.35) { found = i; break; }
        }
        if (found === S.subIdx) return;
        S.subIdx = found;

        if (found < 0) {
          subEl.className = "";
          subEl.textContent = "";
          return;
        }
        var line = S.subs[found];
        var a = directionOf(line.x);
        subEl.innerHTML = "";
        if (a) subEl.appendChild(el("span", "arw", a));
        subEl.appendChild(document.createTextNode(line.x));
        subEl.className = "show";
      }

      /* ==========================================================================
       * 视频侧自动暂停
