<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自动战斗计划 · 配置</title>
<script>
// 白屏兜底：脚本哪一步崩了都把原因写到页面上，不留一片空白让人猜。
// 必须在主脚本之前，且不能依赖任何全局——它要能在最坏的情况下跑起来。
(function () {
  function show(msg) {
    var box = document.getElementById("app");
    if (!box || box.childNodes.length) return; // 已经渲染出东西了就不打扰
    box.style.cssText = "padding:24px;font:14px/1.8 monospace;color:#c33;white-space:pre-wrap";
    box.textContent = "面板启动失败：" + msg;
  }
  window.addEventListener("error", function (e) {
    show((e && e.message) || "脚本错误");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e && e.reason;
    show((r && (r.message || r)) || "未处理的 Promise 拒绝");
  });
})();
