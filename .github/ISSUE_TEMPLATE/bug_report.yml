name: Bug Report / 脚本问题反馈
description: 反馈 BetterGI 脚本、脚本仓库或分发相关问题
title: "[bug] "
labels:
  - bug
body:
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同问题
          required: true
        - label: 我已阅读相关脚本的 README 或使用说明
          required: true
        - label: 我已确认问题来自脚本或脚本仓库；BetterGI 本体问题应提交到主仓库
          required: true
        - label: 我已移除日志、截图中的 UID、路径等隐私信息
          required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - JS 脚本
        - 地图追踪
        - 战斗策略
        - 七圣召唤
        - 脚本仓库与分发
        - 不确定
    validations:
      required: true

  - type: input
    id: bettergi-version
    attributes:
      label: BetterGI 版本号
      placeholder: 例如：0.62.0
    validations:
      required: true

  - type: input
    id: script-name
    attributes:
      label: 相关脚本名称与版本
      placeholder: 例如：莉奈娅挖矿一条龙 0.2.5
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境与关键配置
      description: Windows 版本、游戏服务器与语言、分辨率、相关脚本设置等。
      placeholder: 请填写能够影响问题复现的环境和配置。
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: 问题描述
      placeholder: 描述实际现象、报错和影响。
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: 期望结果
      placeholder: 描述正常情况下应该发生什么。
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 添加脚本……
        2. 设置……
        3. 运行……
    validations:
      required: true

  - type: textarea
    id: logs-and-media
    attributes:
      label: 日志、截图或录屏
      description: 支持拖入 .log/.txt、截图或录屏

  - type: textarea
    id: additional-info
    attributes:
      label: 其他信息
      description: 补充其他有助于定位问题的内容
